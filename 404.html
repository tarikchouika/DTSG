<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — DTSG</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b1220; color: #e6edf7;
      font-family: "Noto Kufi Arabic", "Tajawal", system-ui, "Segoe UI", sans-serif;
      padding: 24px; text-align: center;
    }
    .box { max-width: 520px; }
    .code { font-size: 72px; font-weight: 800; color: #d9b45c; line-height: 1; margin: 0 0 8px; }
    h1 { font-size: 22px; margin: 0 0 12px; font-weight: 700; }
    p { margin: 0 0 10px; color: #9fb0c9; line-height: 1.8; font-size: 15px; }
    .hint { font-size: 13px; color: #6f8199; }
    a.btn {
      display: inline-block; margin-top: 18px; padding: 12px 26px; border-radius: 12px;
      background: #d9b45c; color: #14202f; font-weight: 700; text-decoration: none; font-size: 15px;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط الذي فتحته غير متاح على هذه المنصة.</p>
    <p class="hint">إن كنتَ تتبع رابطاً داخلياً فقد يكون الملف قد نُقل أو حُذف.</p>
    <a class="btn" href="/">العودة إلى الرئيسية</a>
  </div>
</body>
</html>
