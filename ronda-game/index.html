<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="لعبة الروندا المغربية التقليدية — العب ضد الكمبيوتر أو مع الأصدقاء">
  <title>الروندا — اللعبة المغربية التقليدية</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== شاشة البداية ==================== -->
  <section id="screen-menu" class="screen active">
    <div class="menu-decor" aria-hidden="true"></div>
    <div class="menu-card">
      <div class="logo-cards" aria-hidden="true">
        <div class="logo-card lc-1"></div>
        <div class="logo-card lc-2"></div>
        <div class="logo-card lc-3"></div>
      </div>
      <h1 class="game-title">الـرونـدا</h1>
      <p class="game-subtitle">اللعبة المغربية التقليدية بالأوراق</p>

      <div class="menu-section">
        <h2 class="menu-label">نمط اللعب</h2>
        <div class="mode-options" id="mode-options">
          <button class="mode-btn selected" data-mode="ai">
            <span class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="7" width="14" height="12" rx="3"/><circle cx="9.5" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="14.5" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><path d="M12 7V4M12 4h2"/><path d="M2.5 12v3M21.5 12v3"/></svg>
            </span>
            <span class="mode-name">ضد الكمبيوتر</span>
            <span class="mode-desc">تتحدى ذكاءً يفهم الضربة والحبل</span>
          </button>
          <button class="mode-btn" data-mode="2p">
            <span class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8" r="2.8"/><circle cx="15.5" cy="8" r="2.8"/><path d="M3.5 19c0-3 2.2-5 5-5s5 2 5 5M10.5 19c0-3 2.2-5 5-5s5 2 5 5"/></svg>
            </span>
            <span class="mode-name">لاعبان</span>
            <span class="mode-desc">على نفس الجهاز بالتناوب</span>
          </button>
          <button class="mode-btn" data-mode="4p">
            <span class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6.5" r="2.5"/><circle cx="5.5" cy="12" r="2.5"/><circle cx="18.5" cy="12" r="2.5"/><circle cx="12" cy="17.5" r="2.5"/><path d="M12 9v3.5M8 12h-0M14.5 14.5l-1.3 1.3M9.5 14.5l1.3 1.3"/></svg>
            </span>
            <span class="mode-name">زوجان ضد زوجين</span>
            <span class="mode-desc">4 لاعبين بالتناوب</span>
          </button>
        </div>
      </div>

      <div class="menu-section">
        <h2 class="menu-label">هدف الفوز</h2>
        <div class="target-options" id="target-options">
          <button class="target-pill" data-target="41">41</button>
          <button class="target-pill selected" data-target="51">51</button>
          <button class="target-pill" data-target="61">61</button>
        </div>
      </div>

      <div class="menu-section menu-toggles">
        <button class="toggle-item selected" id="toggle-sound" role="switch" aria-checked="true">
          <span class="toggle-track"><span class="toggle-knob"></span></span>
          <span class="toggle-text">المؤثرات الصوتية</span>
        </button>
        <button class="toggle-item selected" id="toggle-privacy" role="switch" aria-checked="true">
          <span class="toggle-track"><span class="toggle-knob"></span></span>
          <span class="toggle-text">حماية خصوصية الأوراق <small>(إخفاء أوراق الخصوم)</small></span>
        </button>
      </div>

      <button class="btn-primary" id="btn-start">ابدأ اللعب</button>
      <button class="btn-ghost" id="btn-rules">قواعد اللعبة</button>
    </div>
  </section>

  <!-- ==================== شاشة اللعب ==================== -->
  <section id="screen-game" class="screen">
    <header class="game-header">
      <button class="icon-btn" id="btn-home" title="القائمة الرئيسية">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
      </button>
      <div class="hud-center">
        <span class="hud-chip">الهدف <b id="hud-target">41</b></span>
        <span class="hud-chip">الجولة <b id="hud-round">1</b></span>
        <span class="hud-chip">التوزيعة <b id="hud-deal">1</b></span>
      </div>
      <button class="icon-btn" id="btn-sound" title="الصوت">
        <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="hidden"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M17 9l5 5M22 9l-5 5"/></svg>
      </button>
    </header>

    <div class="score-strip" id="score-strip"></div>

    <main class="battlefield">
      <aside class="log-panel" id="log-panel">
        <h3 class="log-title">سجل الأحداث</h3>
        <ul class="log-list" id="log-list"></ul>
      </aside>

      <div class="arena">
        <div class="opponents-row" id="opponents-row"></div>

        <div class="felt" id="felt">
          <div class="felt-pattern" aria-hidden="true"></div>
          <div class="deck-pile" id="deck-pile" title="الرزمة">
            <div class="deck-back"></div>
            <div class="deck-back offset1"></div>
            <div class="deck-back offset2"></div>
            <span class="deck-count" id="deck-count">30</span>
          </div>
          <div class="table-cards" id="table-cards"></div>
          <div class="table-caption" id="table-caption">الطاولة</div>
        </div>

        <div class="hand-area">
          <div class="hand-header">
            <span class="hand-label" id="hand-label">أوراقك</span>
            <span class="turn-hint" id="turn-hint"></span>
          </div>
          <div class="hand" id="hand"></div>
        </div>
      </div>
    </main>

    <div class="banner-layer" id="banner-layer" aria-live="polite"></div>
  </section>

  <!-- ==================== الطبقات العلوية ==================== -->

  <!-- حماية الخصوصية بين الأدوار -->
  <div class="overlay hidden" id="overlay-privacy">
    <div class="privacy-card">
      <p class="privacy-kicker">حان دورك</p>
      <h2 class="privacy-name" id="privacy-player-name">اللاعب</h2>
      <p class="privacy-hint">تأكد أن اللاعبين الآخرين لا يرون الشاشة</p>
      <button class="btn-primary" id="btn-reveal">أظهر أوراقي</button>
    </div>
  </div>

  <!-- قواعد اللعبة -->
  <div class="overlay hidden" id="overlay-rules">
    <div class="modal rules-modal">
      <button class="modal-close" id="btn-rules-close" title="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 class="modal-title">قواعد لعبة الروندا</h2>
      <div class="rules-body" id="rules-body"></div>
    </div>
  </div>

  <!-- نتيجة الجولة -->
  <div class="overlay hidden" id="overlay-round">
    <div class="modal round-modal">
      <h2 class="modal-title" id="round-modal-title">انتهت الجولة</h2>
      <div class="breakdown-wrap" id="round-breakdown"></div>
      <button class="btn-primary" id="btn-next-round">الجولة التالية</button>
    </div>
  </div>

  <!-- نهاية المباراة -->
  <div class="overlay hidden" id="overlay-match">
    <div class="modal match-modal">
      <div class="confetti" aria-hidden="true"></div>
      <p class="match-kicker">نهاية المباراة</p>
      <h2 class="match-winner" id="match-winner-name">الفريق أ</h2>
      <p class="match-score" id="match-final-score"></p>
      <div class="breakdown-wrap" id="match-breakdown"></div>
      <button class="btn-primary" id="btn-new-match">مباراة جديدة</button>
      <button class="btn-ghost" id="btn-back-menu">القائمة الرئيسية</button>
    </div>
  </div>

  <script src="js/engine/ronda-core.js"></script>
  <script src="js/engine/ronda-game.js"></script>
  <script src="js/ui/i18n.js"></script>
  <script src="js/ui/audio.js"></script>
  <script src="js/ui/renderer.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
