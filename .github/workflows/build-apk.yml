              /* ═══════════════════════════════════════════════════════════════════
                 [v2.87] LocalNet — شبكة اللعب المحلي المباشر بين الهواتف
                 ─────────────────────────────────────────────────────────────────
                 الاكتشاف : NSD/mDNS على الواي فاي (خدمة _dtsg._tcp مع سجلات TXT:
                            الكود/اللعبة/الاسم/اللاعبون) + إعلان BLE على البلوتوث
                            (بيانات المصنّع تحمل الكود واللعبة وعدد اللاعبين).
                 الاتصال  : TCP مباشر (واي فاي / نقطة اتصال) أو RFCOMM غير آمن
                            (بلوتوث) — قناة جهاز-إلى-جهاز حصراً بلا خادم وبلا إنترنت.
                 الرسائل : أسطر JSON (البروتوكول نفسه الذي كان يسري على DataChannel
                            في نسخ الويب) — الأحداث تُدفع للصفحة عبر
                            window.__dtsgLnEvt(json) بلا أي استطلاع.
                 كل شيء داخل try/catch: عطل الشبكة لا يُسقط التطبيق أبداً.
                 ═══════════════════════════════════════════════════════════════ */
              private class LocalNet {
                  final String NSD_TYPE = "_dtsg._tcp.";
                  final UUID DTSG_UUID = UUID.fromString("8f0c7170-4d5a-4c6e-9d3a-2f6b8a9c1e40");
                  final int MANUF_ID = 0x04D5;
          
                  NsdManager nsd = null;
