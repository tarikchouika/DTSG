      # 8.6) [v2.87·LocalNet] أذونات الشبكة المحلية للّعب المباشر: اكتشاف
      #      NSD/mDNS يحتاج البث المتعدد على الواي فاي، والبلوتوث (إعلان BLE
      #      + مسح + قنوات RFCOMM غير الآمنة بين الهواتف) يحتاج الأذونات
      #      الثلاث على Android 12+ والقديمتين قبلها — كلها عادية بلا موقع.
      #      python3 بمرساة إذن الكاميرا المحقون في 8.4 وفشل صريح إن تغيّر
      #      القالب (نمط 8.4/8.5).
      - name: Inject local-network permissions (NSD multicast + Bluetooth)
        run: |
          python3 - <<'PY25'
          import io, sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = io.open(p, encoding="utf-8").read()
          if "android.permission.BLUETOOTH_CONNECT" in s:
              print("OK أذونات الشبكة المحلية موجودة مسبقاً"); sys.exit(0)
          anchor = '<uses-permission android:name="android.permission.CAMERA" /> <!-- [v2.83] LocalMP QR -->'
          if anchor not in s:
              sys.exit("X قالب AndroidManifest تغيّر: لم أجد مرساة CAMERA — راجع خطوة الحقن (8.6)")
          add = (
              "\n    <!-- [v2.87·LocalNet] الغرفة المحلية: اكتشاف NSD على الواي فاي + بلوتوث مباشر -->\n"
              "    <uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH\" android:maxSdkVersion=\"30\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" android:maxSdkVersion=\"30\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" android:usesPermissionFlags=\"neverForLocation\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_ADVERTISE\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" /> <!-- [v2.87] LocalNet -->"
          )
          s = s.replace(anchor, anchor + add, 1)
          io.open(p, "w", encoding="utf-8").write(s)
