# ═══════════════════════════════════════════════════════════════════════════
# [v2.82] الملف مثبَّت ومزدوج بقاعدة «نسختان متطابقتان» — لم يعد مصدراً عالقاً
# في docs/ وحده (كان كذلك لأن توكن النشر الأول بلا صلاحية workflow ورفض
# GitHub: «refusing to allow a Personal Access Token to create or update
# workflow» — وفّر المالك توكناً بالصلاحية فثُبّت وفق APK_BUILD §0 الخيار 2).
# النسخة العملية هي .github/workflows/، وdocs/workflows/ مرآةٌ للرجوع إليها،
# والاثنتان تُحفظان **متطابقتين بايت ببايت** (`cmp` = 0) عمداً: أي تعديل
# مستقبلي يطبَّق على الاثنتين معاً في المهمة نفسها (القاعدة 18 في AGENTS.md).
# ═══════════════════════════════════════════════════════════════════════════
# [v2.82] سير عمل بناء تطبيق Android وتوقيعه ونشره — Signed Release → GitHub Releases
# ───────────────────────────────────────────────────────────────────────────
# الطلب (توجيه المالك 2026-10-05): ① توقيع إنتاجي بشهادة شخصية ذات صلاحية
# 30 سنة — **لا شهادة Debug الافتراضية** — عبر الأسرار
# (ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS ·
# ANDROID_KEY_PASSWORD). ② رابط تحميل مباشر أوتوماتيكي: كل بناء ينشئ
# **GitHub Release** جديداً ويرفع الملف .apk إليه مباشرة — **بلا ZIP** —
# بضغطة زر (workflow_dispatch) أو عند رفع كود جديد (push).
#
# رابط التحميل المباشر الدائم (أحدث إصدار دائماً — ثابت لأن اسم الملف ثابت):
#   https://github.com/tarikchouika/DTSG/releases/latest/download/DTSG-Gaming-App.apk
#
# ملاحظة معمارية (تكيف ضروري): مجلد android/ **غير محفوظ في المستودع** —
# يولَّد في كل تشغيل عبر `npx cap add android` من إعداد Capacitor المؤقت
# مع webDir=www (يجهّزه scripts/prepare-www.sh). بهذا يبقى المستودع نظيفاً
# بلا ملفات منصّة ثقيلة، وكل بناء من إعداد حديث واحد. ولأن القالب لا يوقّع
# الإصدارات أصلاً (لا signingConfig فيه)، تُحقن شهادة الإنتاج في
# android/app/build.gradle خطوةً مخصصة (8.7) قبل Gradle — على مولَّد حديث
# في كل مرة، فلا أثر دائم ولا ملف منصّة في المستودع.
#
# المُخرج الابتدائي: **Release** بوسم apk-v<إصدار الحزمة>-build<رقم التشغيل>
# يحمل DTSG-Gaming-App.apk (موقَّع بشهادة المالك) + بصمة SHA-256. ويبقى
# Artifact ‏DSTG-Gaming-App-Release ‏(ZIP لمدة 7 أيام) نسخة احتياطية
# للتشخيص فقط — طريقة التنزيل والتثبيت: docs/APK_BUILD.md §7
# ═══════════════════════════════════════════════════════════════════════════
name: Build Android APK (Release → GitHub Releases)

on:
  push:
    branches: [main, master]
    # استثناء ملفات التوثيق: تعديلها وحده لا يستدعي بناء (المستند §أ)
    # [v2.81] النمط العام '**/*.md' يغطي كل مستند مهما كان موضعه (القائمة
    # السابقة غطّت 3 ملفات جذرة فقط (README.md المذكورة غير موجودة) + docs/**
    # فبقي سبعة *.md جذرياً خارجها — الترقيم أدناه على 10 ملفات جذرة).)
    # ⚠️ ملفات الواجهة التي تُشحن داخل التطبيق (_headers · _redirects ·
    #    index.html · js/ · css/ · assets/) ليست توثيقاً ويجب أن تُعيد البناء.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch: {}   # تشغيل يدوي بضغطة زر من واجهة GitHub (المستند §أ)

# [v2.82] كانت contents: read — إنشاء Release ووسمه يتطلب **كتابة contents**
# عبر GITHUB_TOKEN (الوسم والإصدار يُنشآن في المستودع؛ لا شيء آخر يُكتب).
permissions:
  contents: write

# [v2.81] دفعات سريعة متتابعة = ثلاثة بناءات Gradle متوازية بلا فائدة؛
# وتنزيلٌ معلّق لا يجوز أن يحرق ست ساعات من زمن العدّاد.
concurrency:
  group: apk-build
  cancel-in-progress: true

# [v2.82] اسم ملف الـAPK في الـRelease — **ثابت عمداً** ليظل رابط
# /releases/latest/download/DTSG-Gaming-App.apk صالحاً للأبد.
env:
  APK_NAME: DTSG-Gaming-App

jobs:
  build-apk:
    name: Capacitor Android Release APK (signed → GitHub Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 1) جلب كود المستودع
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Node.js 22 + التخزين المؤقت لمكتبات npm (المستند §ب-3)
      #    [v2.81] 20 ← 22: package.json يشترط engines >= 22.12.0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3) تثبيت الاعتمادات المحددة بدقة عبر package-lock.json (المستند §ب-4)
      - name: Install dependencies (npm ci)
        run: npm ci

      # 4) تجهيز مجلد www (واجهة المنصة الثابتة) — نفس قائمة نشر Pages
      #    (mkdir -p www يضمن وجوده حتى لو غيّرت القائمة مستقبلاً)
      - name: Prepare www (web assets)
        run: |
          mkdir -p www
          bash scripts/prepare-www.sh www

      # 5) Capacitor 6 (متوافق Java 17/Gradle 8 — بلا تعديل package.json/lock
      #    في المستودع: --no-save يبقي الشجرة نظيفة بعد انتهاء التشغيل)
      - name: Install Capacitor (no-save)
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      # 6) إعداد Capacitor المؤقت + توليد مشروع Android + مزامنة www
      #    (android/ ليس في المستودع: يُنشأ حديثاً في كل تشغيل)
      - name: Capacitor config + add android + sync
        run: |
          # [v2.86] backgroundColor كحلي كهوية المنصة (#0b1526): Bridge يلوّن به
          # خلفية WebView قبل أول رسم للصفحة فلا وميض فاتح خلف الشريطين
          # الشفافين عند الإقلاع أو أثناء التمرير المطاطي (CapConfig يقرأه).
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dtsg.app",
            "appName": "DTSG",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "backgroundColor": "#0b1526"
          }
          JSON
          [ -d android ] || npx cap add android
          npx cap sync android

      # 6.5) [v2.81.3] أيقونة التطبيق وشاشة البدء من لوغو المنصة — كان القالب
      #      يخرج بأيقونة Capacitor الافتراضية (روبوت) فلا يحمل التطبيق شعار
      #      المنصة. @capacitor/assets يقرأ resources/icon.png وresources/splash.png
      #      (مُلزَمان في المستودع) ويكتب res/mipmap* وres/drawable* داخل android/.
      #      [إصلاح بناء #2 الفاشل] تثبيت الأداة في جذر المساحة كان يعبث بnode_modules
      #      بعد cap add (npm أزال 3 حزم وغيّر 14) فانكسر :capacitor-android
      #      أمام Gradle («None of the consumable configurations have attributes»)
      #      ⇒ التثبيت الآن معزول في /tmp/capassets: حزم المساحة لا تُمسّ بعد cap add.
      # 6.5) [v2.87·إصلاح ميداني] أيقونة كبيرة جذابة بلا حاوية سوداء — كان
      #      السير (منذ v2.83) يبني الطبقات التكيفية شفافة بالكامل، لكن أندرويد
      #      يركّب الأيقونة التكيفية فوق خلفية سوداء كلما كانت طبقة الخلفية
      #      شفافة، فظهر «لوغو صغير داخل حاوية مربعة سوداء» (بلاغ المالك
      #      2026-10-06). والقياس الفعلي لمخرجات @capacitor/assets@3 أثبت أن
      #      ملف المصدر يُمدّد ليطابق منطقة الرؤية المقنّعة (72dp) حرفياً
      #      (inset 16.7%) — أي أن لوغو v2.83 (69-76% من اللوحة) كان يُعرض
      #      صغيراً داخل الشكل المقنّع والباقي أسود. الإصلاح:
      #      icon-foreground.png = اللوغو يغطي 90% من منطقة الرؤية (كبير
      #      وجذاب) + icon-background.png = تدرّج كحلي من هوية المنصة
      #      (#0b1526) — لأن أندرويد يقنّع كل أيقونة شكلَ دائرة/مربع مستدير
      #      ولا توجد أيقونة بلا خلفية أصلاً: ملء القناع بكحلي المنصة يجعل
      #      الأيقونة «المنصة نفسها» ولا يظهر أسود أبداً + icon.png (الأجهزة
      #      القديمة والمتجر) = شارة كحلية بحدّ ذهبي رقيق وعملة فاخرة.
      #      ألوان شاشة البدء كما هي حصراً — لا علم --iconBackgroundColor.
      - name: Generate app icons + splash from platform logo
        run: |
          mkdir -p /tmp/capassets
          ( cd /tmp/capassets && npm init -y >/dev/null && npm install @capacitor/assets@3 )
          /tmp/capassets/node_modules/.bin/capacitor-assets generate --android --assetPath resources \
            --splashBackgroundColor '#0b1526' --splashBackgroundColorDark '#0b1526'

      # 7) Java 17 (OpenJDK) المتوافق تماماً مع Gradle/Capacitor 6 + كاش Gradle
      #    (المستند §ب-5)
      # 8.4) [v2.83·LocalMP] إذن الكاميرا لمسح رموز QR في الغرفة المحلية —
      #      قالب Capacitor لا يضم CAMERA أصلاً فماسح الرموز يحتاجه (getUserMedia).
      #      python3 بمرساة إذن INTERNET القياسية وفشل صريح إن تغيّر القالب.
      - name: Inject CAMERA permission for local-room QR scanning
        run: |
          python3 - <<'PY2'
          import io, sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = io.open(p, encoding="utf-8").read()
          if "android.permission.CAMERA" in s:
              print("✓ إذن الكاميرا موجود مسبقاً"); sys.exit(0)
          anchor = "<uses-permission android:name=\"android.permission.INTERNET\" />"
          if anchor not in s:
              sys.exit("✗ قالب AndroidManifest تغيّر: لم أجد مرساة INTERNET — راجع خطوة الحقن (8.4)")
          s = s.replace(anchor, anchor + "\n    <uses-permission android:name=\"android.permission.CAMERA\" /> <!-- [v2.83] LocalMP QR -->", 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("✓ أُضيف إذن CAMERA لمسح رموز الغرفة المحلية")
          PY2

      # 8.5) [v2.85·Android] ملء الشاشة 100% (edge-to-edge) — بلاغ المالك
      #      2026-10-06: «التطبيق لا يملئ الشاشة، شريط أعلى وأسفل يفسدان
      #      المظهر». الجذر: قالب Capacitor يلوّن شريطي النظام فلا يمتد الويب
      #      خلفهما. الإصلاح ثلاثي: ① styles.xml يجعل الشريطين شفافين مع
      #      shortEdges (لا أشرطة سوداء عند النوتش/اللاندسكيب). ② MainActivity
      #      يحقن جسر DTSGNative: getInsets() يعيد "top|bottom" (systemBars
      #      حصراً — بلا IME) تسحبه الصفحة وتضبط --safe-top/--safe-bottom
      #      (كل الكروم يستعمل المتغيرين)، وpushInsets من جافا عند كل تغيّر
      #      (دوران/تغيّر شريط التنقل)، وsetBarsLight يتبع ثيم المنصة لأيقونات
      #      الشريطين (تستدعيه updateThemeIcon في utils.js). ③ الصفحة:
      #      viewport-fit=cover موجود أصلاً وenv() هي الافتراض.
      #      python3 بمرساة نصية دقيقة وفشل صريح إن تغيّر القالب (نمط 8.4).
      #      [v2.87·الوضع الغامر — بلاغ المالك 2026-10-06: «الشريطان يتداخلان
      #      مع أزرار المنصة والألعاب»]: الشفافية وحدها أبقت شريطي النظام فوق
      #      المحتوى فتداخلا مع أزرار الواجهة. الإصلاح الاحترافي المعتمد في
      #      التطبيقات الكبرى: الشريطان مخفيان آلياً عند فتح التطبيق
      #      (hide(systemBars)) ويظهران مؤقتاً بالسحب من الحافة فقط
      #      (BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE) ثم يختفيان وحدهما —
      #      فلا تداخل إطلاقاً والمساحات الآمنة تُصفَّر تلقائياً.
      #      [v2.87·LocalNet — جسر اللعب المحلي المباشر]: نفس الجسر يضم وحدة
      #      LocalNet (NSD/mDNS اكتشافاً على الواي فاي + إعلان/مسح BLE على
      #      البلوتوث + قنوات TCP/RFCOMM مباشرة بين الهواتف بلا خادم وبلا
      #      روابط) — كود غرفة من 8 حروف وأرقام والأحداث عبر
      #      window.__dtsgLnEvt. الكود بلا أي شرطة مائلة عكسية عمداً فهو
      #      يسكن سلسلة python ثلاثية.
      #      [v2.86·درس ميداني 2026-10-06 — بلاغ «فراغ أسود أعلى وأسفل»]:
      #      شفافية الشريطين وحدها لا تملأ الشاشة: إطار المحتوى بقي محشوراً
      #      بينهما فظهرت خلفية النافذة الفاتحة (Theme.AppCompat.DayNight في
      #      وضع النظام الفاتح) عبر الشريطين الشفافين — شريط أبيض أعلى ورمادي
      #      (سكرام 40% للتنقل بأزرار) أسفل. الجوهر الناقص: جملة التخطيط
      #      WindowCompat.setDecorFitsSystemWindows(w, false) تمدّد إطار
      #      المحتوى (الويب) خلف الشريطين على كل الإصدارات (تُترجم تلقائياً
      #      إلى أعلام LAYOUT_STABLE|FULLSCREEN|HIDE_NAVIGATION قبل API 30)،
      #      + خلفية نافذة وWebView كحلية (#0b1526) فلا وميض فاتح أبداً،
      #      + WindowInsetsControllerCompat لأيقونات الشريطين (بديل حديث
      #      لأعلام systemUiVisibility المهجورة).
      - name: Edge-to-edge fullscreen + native safe-area bridge (status/nav bars)
        run: |
          python3 - <<'PY3'
          import io, sys

          # ① styles.xml — شريطا النظام شفافان من الثيم نفسه
          p = "android/app/src/main/res/values/styles.xml"
          s = io.open(p, encoding="utf-8").read()
          if "windowDrawsSystemBarBackgrounds" in s:
              print("styles: edge-to-edge موجود مسبقاً")
          else:
              a = '        <item name="android:background">@null</item>\n    </style>'
              if a not in s:
                  sys.exit("X قالب styles.xml تغيّر: لم أجد مرساة AppTheme.NoActionBar — راجع خطوة الحقن (8.5)")
              r = ('        <item name="android:background">@null</item>\n'
                   '        <!-- [v2.85] ملء الشاشة 100%: شريطا النظام شفافان والويب يرسم خلفهما -->\n'
                   '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n'
                   '        <item name="android:statusBarColor">@android:color/transparent</item>\n'
                   '        <item name="android:navigationBarColor">@android:color/transparent</item>\n'
                   '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n'
                   '    </style>')
              s = s.replace(a, r, 1)
              io.open(p, "w", encoding="utf-8").write(s)
              print("OK styles.xml: الشريطان شفافان + shortEdges (ملء الشاشة حافة-لحافة)")

          # ② MainActivity.java — جسر الكروم الأصلي
          p2 = "android/app/src/main/java/com/dtsg/app/MainActivity.java"
          s2 = io.open(p2, encoding="utf-8").read()
          if "DTSGNative" in s2:
              print("MainActivity: الجسر موجود مسبقاً"); sys.exit(0)
          tpl = 'package com.dtsg.app;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {}'
          if s2.strip() != tpl.strip():
              sys.exit("X قالب MainActivity تغيّر: لم أجد الصنف الفارغ المتوقع — راجع خطوة الحقن (8.5)")
          new = '''package com.dtsg.app;
          
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothServerSocket;
          import android.bluetooth.BluetoothSocket;
          import android.bluetooth.le.AdvertiseCallback;
          import android.bluetooth.le.AdvertiseData;
          import android.bluetooth.le.AdvertiseSettings;
          import android.bluetooth.le.BluetoothLeAdvertiser;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanFilter;
          import android.bluetooth.le.ScanRecord;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.drawable.ColorDrawable;
          import android.net.nsd.NsdManager;
          import android.net.nsd.NsdServiceInfo;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicInteger;
          import org.json.JSONObject;
          
          /* [v2.87] ملء الشاشة الغامر + جسر الكروم الأصلي + شبكة اللعب المحلي (LocalNet).
             يُحقن من سير البناء (خطوة 8.5) ويحافظ على كل عقد v2.85/v2.86 حرفياً:
             (1) شريطا النظام شفافان والويب يرسم خلفهما (setDecorFitsSystemWindows=false)
             (2) خلفية كحلية مزدوجة (النافذة + WebView من capacitor.config.json)
             (3) WindowInsetsControllerCompat لأيقونات الشريطين حسب ثيم المنصة
             الجديد في v2.87 (بلاغ المالك 2026-10-06: الشريطان يتداخلان مع أزرار
             المنصة والألعاب):
             (4) الوضع الغامر الاحترافي: الشريطان مخفيان آلياً عند فتح التطبيق
                 ويظهران مؤقتاً بالسحب من الأعلى/الأسفل فقط
                 (BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE) ثم يختفيان وحدهما —
                 صفر تداخل مع أزرار المنصة والألعاب.
             (5) جسر DTSGNative للّعب المحلي: الغرف المحلية تُكتشف آلياً على شبكة
                 الواي فاي (NSD/mDNS) وعبر البلوتوث (إعلان ومسح BLE) وتربط الهواتف
                 مباشرة (TCP على الواي فاي · RFCOMM غير الآمن على البلوتوث) — بلا
                 خادم وبلا إنترنت وبلا أي روابط: كود قصير من 8 حروف وأرقام فقط.
             ملاحظة بناء: الكود بلا أي شرطة مائلة عكسية عمداً — فهو يسكن سلسلة
