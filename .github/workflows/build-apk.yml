                  final AtomicBoolean hosting = new AtomicBoolean(false);
                  ServerSocket tcpServer = null;
                  NsdManager.RegistrationListener nsdReg = null;
                  BluetoothServerSocket btServer = null;
                  BluetoothLeAdvertiser bleAdv = null;
                  AdvertiseCallback advCb = null;
                  volatile String hostCode = "", hostGame = "", hostName = "";
                  volatile int hostMax = 4, hostPlayers = 1, hostPort = 0;
                  /* الضيف: الاكتشاف */
                  final AtomicBoolean discovering = new AtomicBoolean(false);
                  NsdManager.DiscoveryListener nsdDisc = null;
                  BluetoothLeScanner bleScanner = null;
                  ScanCallback scanCb = null;
