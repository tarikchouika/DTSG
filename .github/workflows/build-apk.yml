                  final AtomicBoolean resolving = new AtomicBoolean(false);
                  final Map<String, Long> bleSeen = new ConcurrentHashMap<String, Long>();
                  /* الأطراف: المضيف يرقّم ضيوفه من 1 · الضيف يستعمل 0 للمضيف */
                  final Map<Integer, Link> links = new ConcurrentHashMap<Integer, Link>();
                  final AtomicInteger linkSeq = new AtomicInteger(1);
                  final AtomicBoolean joining = new AtomicBoolean(false);
          
                  /* ── طبقة تجريد المقبس (TCP أو بلوتوث) ── */
                  abstract class Link {
                      abstract OutputStream out() throws IOException;
                      abstract BufferedReader reader() throws IOException;
                      abstract void close();
                      abstract String kind();
                      final Object writeLock = new Object();
                  }
                  class TcpLink extends Link {
                      final Socket s;
                      TcpLink(Socket s) { this.s = s; }
                      OutputStream out() throws IOException { return s.getOutputStream(); }
                      BufferedReader reader() throws IOException {
                          return new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                      }
                      void close() { try { s.close(); } catch (Throwable ignored) { } }
                      String kind() { return "wifi"; }
                  }
                  class BtLink extends Link {
                      final BluetoothSocket s;
                      BtLink(BluetoothSocket s) { this.s = s; }
                      OutputStream out() throws IOException { return s.getOutputStream(); }
                      BufferedReader reader() throws IOException {
                          return new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                      }
                      void close() { try { s.close(); } catch (Throwable ignored) { } }
                      String kind() { return "bt"; }
                  }
          
                  /* ── أدوات ── */
                  NsdManager nsd() {
                      if (nsd == null) {
                          try { nsd = (NsdManager) getSystemService(Context.NSD_SERVICE); } catch (Throwable ignored) { }
                      }
                      return nsd;
                  }
                  BluetoothAdapter btAdapter() {
                      try {
                          BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                          return bm == null ? null : bm.getAdapter();
                      } catch (Throwable t) { return null; }
                  }
                  boolean btOn() {
                      try {
                          BluetoothAdapter a = btAdapter();
                          return a != null && a.isEnabled();
                      } catch (Throwable t) { return false; }
                  }
                  boolean btPermsGranted() {
                      if (Build.VERSION.SDK_INT < 31) return true;   /* أذونات BLUETOOTH القديمة عادية */
                      return perm("android.permission.BLUETOOTH_SCAN")
                          && perm("android.permission.BLUETOOTH_ADVERTISE")
                          && perm("android.permission.BLUETOOTH_CONNECT");
                  }
                  boolean perm(String p) {
                      try {
                          return ActivityCompat.checkSelfPermission(MainActivity.this, p) == PackageManager.PERMISSION_GRANTED;
                      } catch (Throwable t) { return false; }
                  }
                  void requestBtPerms() {
                      try {
                          if (Build.VERSION.SDK_INT >= 31 && !btPermsGranted()) {
                              ActivityCompat.requestPermissions(MainActivity.this, new String[] {
                                  "android.permission.BLUETOOTH_SCAN",
                                  "android.permission.BLUETOOTH_ADVERTISE",
                                  "android.permission.BLUETOOTH_CONNECT" }, 4287);
                          }
                      } catch (Throwable ignored) { }
                  }
                  void btEnable() {
                      try {
                          BluetoothAdapter ada = btAdapter();
                          if (ada == null || ada.isEnabled()) return;
                          Intent i = new Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Throwable ignored) { }
                  }
                  void pushEvent(String json) {
                      try {
                          final Bridge b = getBridge();
                          if (b == null || b.getWebView() == null) return;
                          final String js = "try{window.__dtsgLnEvt&&window.__dtsgLnEvt(" + json + ")}catch(e){}";
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  try { b.getWebView().evaluateJavascript(js, null); } catch (Throwable ignored) { }
                              }
                          });
                      } catch (Throwable ignored) { }
                  }
                  void pushRoom(String code, String game, String name, int max, int players,
                                String ip, int port, String mac, String transport) {
                      try {
                          JSONObject room = new JSONObject();
                          room.put("code", code).put("game", game).put("name", name)
                              .put("max", max).put("players", players);
                          if (ip != null) room.put("ip", ip);
                          if (port > 0) room.put("port", port);
                          if (mac != null) room.put("mac", mac);
                          room.put("transport", transport);
                          pushEvent(new JSONObject().put("t", "room").put("room", room).toString());
                      } catch (Throwable ignored) { }
                  }
                  void pushSimple(String t, String key, String val) {
                      try {
                          pushEvent(new JSONObject().put("t", t).put(key, val).toString());
                      } catch (Throwable ignored) { }
                  }
                  void pushEventId(String t, int id) {
                      try {
                          pushEvent(new JSONObject().put("t", t).put("id", id).toString());
                      } catch (Throwable ignored) { }
                  }
                  /* قيمة سمة TXT — متوافقة مع كل مستويات API (byte[] أو List<byte[]>) */
                  String attr(NsdServiceInfo info, String key) {
                      try {
                          Map<String, ?> m = info.getAttributes();
                          Object v = m.get(key);
                          if (v instanceof List) {
                              List<?> l = (List<?>) v;
                              if (!l.isEmpty() && l.get(0) instanceof byte[]) {
                                  return new String((byte[]) l.get(0), StandardCharsets.UTF_8);
                              }
                          } else if (v instanceof byte[]) {
                              return new String((byte[]) v, StandardCharsets.UTF_8);
                          }
                      } catch (Throwable t) { }
                      return "";
                  }
                  int safeInt(String s, int d) {
                      try { return Integer.parseInt(s.trim()); } catch (Throwable t) { return d; }
                  }
                  void send(int id, String msg) {
                      Link l = links.get(Integer.valueOf(id));
                      if (l == null || msg == null) return;
                      try {
                          synchronized (l.writeLock) {
                              OutputStream os = l.out();
                              os.write(msg.getBytes(StandardCharsets.UTF_8));
                              os.write(10);                              /* سطر جديد */
                              os.flush();
                          }
                      } catch (Throwable t) {
                          dropLink(Integer.valueOf(id), l);
                      }
                  }
                  void dropLink(Integer id, Link l) {
                      try { l.close(); } catch (Throwable ignored) { }
                      if (links.remove(id) != null) {
                          pushEventId("peerClose", id.intValue());
                      }
                  }
                  void pumpRead(final Integer id, final Link l) {
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  BufferedReader r = l.reader();
                                  String line;
                                  while ((line = r.readLine()) != null) {
                                      String t = line.trim();
                                      if (t.length() == 0) continue;
                                      if (t.length() > 262144) t = t.substring(0, 262144);
                                      try {
                                          pushEvent(new JSONObject().put("t", "data")
                                              .put("id", id.intValue()).put("s", t).toString());
                                      } catch (Throwable ignored) { }
                                  }
                              } catch (Throwable ignored) { }
                              dropLink(id, l);
                          }
                      }, "ln-read-" + id).start();
                  }
          
                  /* ── المضيف: فتح الغرفة (TCP + NSD + بلوتوث) ── */
                  void host(String json) {
                      String code = "", game = "", name = "Host";
                      int max = 4;
                      try {
                          JSONObject o = new JSONObject(json == null ? "" : json);
                          code = o.optString("code", "");
                          game = o.optString("game", "");
                          name = o.optString("name", "Host");
                          max = Math.max(2, Math.min(6, o.optInt("max", 4)));
                      } catch (Throwable ignored) { }
                      if (code.length() != 8) {
                          pushSimple("hostErr", "err", "bad-code");
                          return;
                      }
                      final String fCode = code, fGame = game, fName = name;
                      final int fMax = max;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  leave();                                    /* نظافة أولاً */
                                  hostCode = fCode; hostGame = fGame; hostName = fName;
                                  hostMax = fMax; hostPlayers = 1;
                                  tcpServer = new ServerSocket(0);
                                  hostPort = tcpServer.getLocalPort();
                                  hosting.set(true);
                                  acceptTcpLoop();
                                  registerNsd();
                                  /* البلوتوث: إن كانت الأذونات ناقصة نطلبها (طلب سياقي
                                     من نقر زر الاستضافة) — والصفحة تعيد المحاولة عند
                                     حدث btPerms عبر hostUpdate */
                                  if (btOn() && !btPermsGranted()) requestBtPerms();
                                  ensureBtHost();
                                  try {
                                      pushEvent(new JSONObject().put("t", "hostReady")
                                          .put("code", fCode).put("port", hostPort).toString());
                                  } catch (Throwable ignored) { }
                              } catch (Throwable t) {
                                  hosting.set(false);
                                  pushSimple("hostErr", "err", String.valueOf(t));
                              }
                          }
                      }, "ln-host").start();
                  }
                  void acceptTcpLoop() {
                      final ServerSocket ss = tcpServer;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              while (hosting.get()) {
                                  try {
                                      Socket s = ss.accept();
                                      if (!hosting.get()) { try { s.close(); } catch (Throwable ignored) { } continue; }
                                      Integer id = Integer.valueOf(linkSeq.getAndIncrement());
                                      Link l = new TcpLink(s);
                                      links.put(id, l);
                                      pumpRead(id, l);
                                      pushEventId("peerOpen", id.intValue());
                                  } catch (Throwable t) {
                                      if (!hosting.get()) return;
                                      try { Thread.sleep(400); } catch (Throwable ignored) { return; }
                                  }
                              }
                          }
                      }, "ln-tcp-accept").start();
                  }
                  void registerNsd() {
                      try {
                          NsdManager m = nsd();
                          if (m == null) return;
                          NsdServiceInfo si = new NsdServiceInfo();
                          si.setServiceName("DTSG-" + hostCode);
                          si.setServiceType(NSD_TYPE);
                          si.setPort(hostPort);
                          si.setAttribute("v", "2");
                          si.setAttribute("code", hostCode);
                          si.setAttribute("game", hostGame);
                          si.setAttribute("name", hostName);
                          si.setAttribute("max", String.valueOf(hostMax));
                          si.setAttribute("players", String.valueOf(hostPlayers));
                          nsdReg = new NsdManager.RegistrationListener() {
                              @Override public void onServiceRegistered(NsdServiceInfo s) { }
                              @Override public void onRegistrationFailed(NsdServiceInfo s, int e) { }
                              @Override public void onServiceUnregistered(NsdServiceInfo s) { }
                              @Override public void onUnregistrationFailed(NsdServiceInfo s, int e) { }
                          };
                          m.registerService(si, NsdManager.PROTOCOL_DNS_SD, nsdReg);
                      } catch (Throwable ignored) { }
                  }
                  /* مستمع RFCOMM (مرة واحدة) + إعلان BLE — يُعاد عند توفر الأذونات */
                  void ensureBtHost() {
                      try {
                          if (!hosting.get() || !btOn() || !btPermsGranted()) return;
                          BluetoothAdapter ada = btAdapter();
                          if (btServer == null && ada != null) {
                              btServer = ada.listenUsingInsecureRfcommWithServiceRecord("DTSG", DTSG_UUID);
                              acceptBtLoop();
                          }
                          if (bleAdv == null || advCb == null) {
                              bleAdv = ada.getBluetoothLeAdvertiser();
                              if (bleAdv != null) bleAdvertise();
                          }
                      } catch (Throwable ignored) { }
                  }
                  void acceptBtLoop() {
                      final BluetoothServerSocket bs = btServer;
                      if (bs == null) return;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              while (hosting.get()) {
                                  try {
                                      BluetoothSocket s = bs.accept();
                                      if (!hosting.get()) { try { s.close(); } catch (Throwable ignored) { } continue; }
                                      Integer id = Integer.valueOf(linkSeq.getAndIncrement());
                                      Link l = new BtLink(s);
                                      links.put(id, l);
                                      pumpRead(id, l);
                                      pushEventId("peerOpen", id.intValue());
                                  } catch (Throwable t) {
                                      if (!hosting.get()) return;
                                  }
                              }
                          }
                      }, "ln-bt-accept").start();
                  }
                  byte[] advPayload() {
                      try {
                          byte[] g = hostGame.getBytes(StandardCharsets.UTF_8);
                          if (g.length > 6) g = Arrays.copyOf(g, 6);
                          byte[] p = new byte[1 + 8 + 1 + g.length + 1];
                          p[0] = 1;                                   /* نسخة الحزمة */
                          byte[] c = hostCode.getBytes(StandardCharsets.UTF_8);
                          for (int i = 0; i < 8 && i < c.length; i++) p[1 + i] = c[i];
                          p[9] = (byte) g.length;
                          System.arraycopy(g, 0, p, 10, g.length);
                          p[10 + g.length] = (byte) hostPlayers;
                          return p;
                      } catch (Throwable t) { return new byte[] { 1 }; }
                  }
                  void bleAdvertise() {
                      try {
                          if (bleAdv == null) return;
                          AdvertiseSettings st = new AdvertiseSettings.Builder()
                              .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_BALANCED)
                              .setConnectable(false)
                              .setTimeout(0)
                              .build();
                          AdvertiseData data = new AdvertiseData.Builder()
                              .addManufacturerData(MANUF_ID, advPayload())
                              .setIncludeDeviceName(false)
                              .setIncludeTxPowerLevel(false)
                              .build();
                          advCb = new AdvertiseCallback() { };
                          bleAdv.startAdvertising(st, data, advCb);
                      } catch (Throwable ignored) { }
                  }
                  void stopBleAdvertise() {
                      try {
                          if (bleAdv != null && advCb != null) bleAdv.stopAdvertising(advCb);
                      } catch (Throwable ignored) { }
                      bleAdv = null; advCb = null;
                  }
                  /* تحديث عدد اللاعبين في الإعلانات (NSD يُعاد تسجيله · BLE يُعاد بثّه) */
                  void hostUpdate(String json) {
                      try {
                          JSONObject o = new JSONObject(json == null ? "{}" : "{}");
                          hostPlayers = Math.max(1, Math.min(6, o.optInt("players", hostPlayers)));
                      } catch (Throwable ignored) { }
                      if (!hosting.get()) return;
                      try {
                          if (nsdReg != null && nsd() != null) {
                              NsdManager.RegistrationListener old = nsdReg;
                              try { nsd().unregisterService(old); } catch (Throwable ignored) { }
                              nsdReg = null;
                              registerNsd();
                          }
                          stopBleAdvertise();
                          ensureBtHost();
                      } catch (Throwable ignored) { }
                  }
          
                  /* ── الضيف: الاكتشاف الآلي (NSD + BLE) ── */
                  void discoverStart(String json) {
                      boolean wantBt = false;
                      try {
                          JSONObject o = new JSONObject(json == null ? "{}" : "{}");
                          wantBt = o.optBoolean("bt", false);
                      } catch (Throwable ignored) { }
                      if (wantBt) requestBtPerms();          /* طلب سياقي — مرة واحدة */
                      try {
                          NsdManager m = nsd();
                          if (m != null && !discovering.get()) {
                              discovering.set(true);
                              nsdDisc = new NsdManager.DiscoveryListener() {
                                  @Override public void onStartDiscoveryFailed(String t, int e) { discovering.set(false); }
                                  @Override public void onStopDiscoveryFailed(String t, int e) { }
                                  @Override public void onDiscoveryStarted(String t) { }
                                  @Override public void onDiscoveryStopped(String t) { }
                                  @Override public void onServiceFound(NsdServiceInfo s) {
                                      if (s.getServiceType() != null && s.getServiceType().contains("dtsg")) enqueueResolve(s);
                                  }
                                  @Override public void onServiceLost(NsdServiceInfo s) {
                                      pushSimple("roomGone", "name", s.getServiceName() == null ? "" : s.getServiceName());
                                  }
                              };
                              m.discoverServices(NSD_TYPE, NsdManager.PROTOCOL_DNS_SD, nsdDisc);
                          }
                      } catch (Throwable ignored) { }
                      if (wantBt) startBleScan();
                  }
                  void discoverStop() {
                      try {
                          if (nsd != null && nsdDisc != null) nsd.stopServiceDiscovery(nsdDisc);
                      } catch (Throwable ignored) { }
                      nsdDisc = null;
                      discovering.set(false);
                      stopBleScan();
                      resolveQ.clear();
                  }
                  void enqueueResolve(NsdServiceInfo svc) {
                      resolveQ.add(svc);
                      drainResolve();
                  }
                  void drainResolve() {
                      if (!resolving.compareAndSet(false, true)) return;
                      NsdServiceInfo svc = resolveQ.poll();
                      if (svc == null) {
                          resolving.set(false);
                          if (!resolveQ.isEmpty()) drainResolve();   /* نافذة سباق مغلقة */
                          return;
                      }
                      try {
                          nsd().resolveService(svc, new NsdManager.ResolveListener() {
                              @Override public void onResolveFailed(NsdServiceInfo s, int e) {
                                  resolving.set(false);
                                  drainResolve();
                              }
                              @Override public void onServiceResolved(NsdServiceInfo info) {
                                  try {
                                      String code = attr(info, "code");
                                      if (code.length() == 8 && info.getHost() != null) {
                                          pushRoom(code, attr(info, "game"), attr(info, "name"),
                                              safeInt(attr(info, "max"), 4), safeInt(attr(info, "players"), 1),
                                              info.getHost().getHostAddress(), info.getPort(), null, "wifi");
                                      }
                                  } catch (Throwable ignored) { }
                                  resolving.set(false);
                                  drainResolve();
                              }
                          });
                      } catch (Throwable t) {
                          resolving.set(false);
                          drainResolve();
                      }
                  }
                  void startBleScan() {
                      try {
                          if (Build.VERSION.SDK_INT < 21) return;
                          if (!btPermsGranted() || !btOn()) return;
                          BluetoothAdapter ada = btAdapter();
                          if (ada == null) return;
                          if (bleScanner != null && scanCb != null) return;   /* يعمل أصلاً */
                          bleScanner = ada.getBluetoothLeScanner();
                          if (bleScanner == null) return;
                          scanCb = new ScanCallback() {
                              @Override public void onScanResult(int cb, ScanResult result) {
                                  try {
                                      ScanRecord rec = result.getScanRecord();
                                      if (rec == null) return;
                                      byte[] p = rec.getManufacturerSpecificData(MANUF_ID);
                                      if (p == null || p.length < 10) return;
                                      String code = new String(p, 1, 8, StandardCharsets.UTF_8).trim();
                                      if (code.length() != 8) return;
                                      long now = android.os.SystemClock.elapsedRealtime();
                                      Long last = bleSeen.get(code);
                                      if (last != null && now - last < 2500) return;   /* مضاد للتكرار */
                                      bleSeen.put(code, now);
                                      int gl = p[9] & 0xFF;
                                      String game = gl > 0 && 10 + gl <= p.length
                                          ? new String(p, 10, gl, StandardCharsets.UTF_8) : "";
                                      int players = (10 + gl < p.length) ? (p[10 + gl] & 0xFF) : 1;
                                      pushRoom(code, game, "", 4, Math.max(1, players),
                                          null, 0, result.getDevice().getAddress(), "bt");
                                  } catch (Throwable ignored) { }
                              }
                              @Override public void onScanFailed(int e) { }
                          };
                          List<ScanFilter> fl = new ArrayList<ScanFilter>();
                          fl.add(new ScanFilter.Builder()
                              .setManufacturerData(MANUF_ID, new byte[0], new byte[0])
                              .build());
                          ScanSettings st = new ScanSettings.Builder()
                              .setScanMode(ScanSettings.SCAN_MODE_BALANCED)
                              .build();
                          bleScanner.startScan(fl, st, scanCb);
                      } catch (Throwable ignored) { }
                  }
                  void stopBleScan() {
                      try {
                          if (bleScanner != null && scanCb != null) bleScanner.stopScan(scanCb);
                      } catch (Throwable ignored) { }
                      bleScanner = null; scanCb = null;
                  }
          
                  /* ── الضيف: الانضمام (TCP أو RFCOMM — مباشرة بالراديو) ── */
                  void join(String json) {
                      String code = "", ip = "", mac = "";
                      int port = 0;
                      try {
                          JSONObject o = new JSONObject(json == null ? "" : json);
                          code = o.optString("code", "");
                          ip = o.optString("ip", "");
                          mac = o.optString("mac", "");
                          port = o.optInt("port", 0);
                      } catch (Throwable ignored) { }
                      final String fCode = code, fIp = ip, fMac = mac;
                      final int fPort = port;
                      if (!joining.compareAndSet(false, true)) return;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  leave();
                                  Link l = null;
                                  if (fMac.length() >= 12 && btPermsGranted()) {
                                      try {
                                          BluetoothAdapter ada = btAdapter();
                                          if (ada != null && ada.isEnabled()) {
                                              BluetoothDevice dev = ada.getRemoteDevice(fMac);
                                              BluetoothSocket s = dev.createInsecureRfcommSocketToServiceRecord(DTSG_UUID);
                                              s.connect();
                                              l = new BtLink(s);
                                          }
                                      } catch (Throwable t) { l = null; }
                                  }
                                  if (l == null && fIp.length() > 6 && fPort > 0) {
                                      Socket s = new Socket();
                                      s.connect(new InetSocketAddress(fIp, fPort), 6000);
                                      try { s.setTcpNoDelay(true); } catch (Throwable ignored) { }
                                      l = new TcpLink(s);
                                  }
                                  if (l == null) {
                                      joining.set(false);
                                      pushSimple("joinErr", "err", "connect");
                                      return;
                                  }
                                  Integer zero = Integer.valueOf(0);
                                  links.put(zero, l);
                                  pumpRead(zero, l);
                                  try {
                                      pushEvent(new JSONObject().put("t", "joined")
                                          .put("code", fCode).put("kind", l.kind()).toString());
                                  } catch (Throwable ignored) { }
                                  joining.set(false);
                              } catch (Throwable t) {
                                  joining.set(false);
                                  pushSimple("joinErr", "err", String.valueOf(t));
                              }
                          }
                      }, "ln-join").start();
                  }
          
                  /* ── التفكيك الكامل ── */
                  void leave() {
                      hosting.set(false);
                      for (Map.Entry<Integer, Link> e : links.entrySet()) {
                          try { e.getValue().close(); } catch (Throwable ignored) { }
                      }
                      links.clear();
                      try { if (tcpServer != null) tcpServer.close(); } catch (Throwable ignored) { }
                      tcpServer = null;
                      try { if (btServer != null) btServer.close(); } catch (Throwable ignored) { }
                      btServer = null;
                      try {
                          if (nsd != null && nsdReg != null) nsd.unregisterService(nsdReg);
                      } catch (Throwable ignored) { }
                      nsdReg = null;
                      try {
                          if (nsd != null && nsdDisc != null) nsd.stopServiceDiscovery(nsdDisc);
                      } catch (Throwable ignored) { }
                      nsdDisc = null;
                      discovering.set(false);
                      stopBleAdvertise();
                      stopBleScan();
                      resolveQ.clear();
                      bleSeen.clear();
                  }
              }
          }
          '''
          io.open(p2, "w", encoding="utf-8").write(new)
