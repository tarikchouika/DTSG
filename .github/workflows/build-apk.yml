# ═══════════════════════════════════════════════════════════════════════════
# [v2.82] الملف مثبَّت ومزدوج بقاعدة «نسختان متطابقتان» — لم يعد مصدراً عالقاً
# في docs/ وحده (كان كذلك لأن توكن النشر الأول بلا صلاحية workflow ورفض
# GitHub: «refusing to allow a Personal Access Token to create or update
# workflow» — وفّر المالك توكناً بالصلاحية فثُبّت وفق APK_BUILD §0 الخيار 2).
# النسخة العملية هي .github/workflows/، وdocs/workflows/ مرآةٌ للرجوع إليها،
# والاثنتان تُحفظان **متطابقتين بايت ببايت** (`cmp` = 0) عمداً: أي تعديل
# مستقبلي يطبَّق على الاثنتين معاً في المهمة نفسها (القاعدة 18 في AGENTS.md).
# ═══════════════════════════════════════════════════════════════════════════
# [v2.82] سير عمل بناء تطبيق Android وتوقيعه ونشره — Signed Release → GitHub Releases
# ───────────────────────────────────────────────────────────────────────────
# الطلب (توجيه المالك 2026-10-05): ① توقيع إنتاجي بشهادة شخصية ذات صلاحية
# 30 سنة — **لا شهادة Debug الافتراضية** — عبر الأسرار
# (ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS ·
# ANDROID_KEY_PASSWORD). ② رابط تحميل مباشر أوتوماتيكي: كل بناء ينشئ
# **GitHub Release** جديداً ويرفع الملف .apk إليه مباشرة — **بلا ZIP** —
# بضغطة زر (workflow_dispatch) أو عند رفع كود جديد (push).
#
# رابط التحميل المباشر الدائم (أحدث إصدار دائماً — ثابت لأن اسم الملف ثابت):
#   https://github.com/tarikchouika/DTSG/releases/latest/download/DTSG-Gaming-App.apk
#
# ملاحظة معمارية (تكيف ضروري): مجلد android/ **غير محفوظ في المستودع** —
# يولَّد في كل تشغيل عبر `npx cap add android` من إعداد Capacitor المؤقت
# مع webDir=www (يجهّزه scripts/prepare-www.sh). بهذا يبقى المستودع نظيفاً
# بلا ملفات منصّة ثقيلة، وكل بناء من إعداد حديث واحد. ولأن القالب لا يوقّع
# الإصدارات أصلاً (لا signingConfig فيه)، تُحقن شهادة الإنتاج في
# android/app/build.gradle خطوةً مخصصة (8.7) قبل Gradle — على مولَّد حديث
# في كل مرة، فلا أثر دائم ولا ملف منصّة في المستودع.
#
# المُخرج الابتدائي: **Release** بوسم apk-v<إصدار الحزمة>-build<رقم التشغيل>
# يحمل DTSG-Gaming-App.apk (موقَّع بشهادة المالك) + بصمة SHA-256. ويبقى
# Artifact ‏DSTG-Gaming-App-Release ‏(ZIP لمدة 7 أيام) نسخة احتياطية
# للتشخيص فقط — طريقة التنزيل والتثبيت: docs/APK_BUILD.md §7
# ═══════════════════════════════════════════════════════════════════════════
name: Build Android APK (Release → GitHub Releases)

on:
  push:
    branches: [main, master]
    # استثناء ملفات التوثيق: تعديلها وحده لا يستدعي بناء (المستند §أ)
    # [v2.81] النمط العام '**/*.md' يغطي كل مستند مهما كان موضعه (القائمة
    # السابقة غطّت 3 ملفات جذرة فقط (README.md المذكورة غير موجودة) + docs/**
    # فبقي سبعة *.md جذرياً خارجها — الترقيم أدناه على 10 ملفات جذرة).)
    # ⚠️ ملفات الواجهة التي تُشحن داخل التطبيق (_headers · _redirects ·
    #    index.html · js/ · css/ · assets/) ليست توثيقاً ويجب أن تُعيد البناء.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch: {}   # تشغيل يدوي بضغطة زر من واجهة GitHub (المستند §أ)

# [v2.82] كانت contents: read — إنشاء Release ووسمه يتطلب **كتابة contents**
# عبر GITHUB_TOKEN (الوسم والإصدار يُنشآن في المستودع؛ لا شيء آخر يُكتب).
permissions:
  contents: write

# [v2.81] دفعات سريعة متتابعة = ثلاثة بناءات Gradle متوازية بلا فائدة؛
# وتنزيلٌ معلّق لا يجوز أن يحرق ست ساعات من زمن العدّاد.
concurrency:
  group: apk-build
  cancel-in-progress: true

# [v2.82] اسم ملف الـAPK في الـRelease — **ثابت عمداً** ليظل رابط
# /releases/latest/download/DTSG-Gaming-App.apk صالحاً للأبد.
env:
  APK_NAME: DTSG-Gaming-App

jobs:
  build-apk:
    name: Capacitor Android Release APK (signed → GitHub Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 1) جلب كود المستودع
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Node.js 22 + التخزين المؤقت لمكتبات npm (المستند §ب-3)
      #    [v2.81] 20 ← 22: package.json يشترط engines >= 22.12.0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3) تثبيت الاعتمادات المحددة بدقة عبر package-lock.json (المستند §ب-4)
      - name: Install dependencies (npm ci)
        run: npm ci

      # 4) تجهيز مجلد www (واجهة المنصة الثابتة) — نفس قائمة نشر Pages
      #    (mkdir -p www يضمن وجوده حتى لو غيّرت القائمة مستقبلاً)
      - name: Prepare www (web assets)
        run: |
          mkdir -p www
          bash scripts/prepare-www.sh www

      # 5) Capacitor 6 (متوافق Java 17/Gradle 8 — بلا تعديل package.json/lock
      #    في المستودع: --no-save يبقي الشجرة نظيفة بعد انتهاء التشغيل)
      - name: Install Capacitor (no-save)
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      # 6) إعداد Capacitor المؤقت + توليد مشروع Android + مزامنة www
      #    (android/ ليس في المستودع: يُنشأ حديثاً في كل تشغيل)
      - name: Capacitor config + add android + sync
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dtsg.app",
            "appName": "DTSG",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          [ -d android ] || npx cap add android
          npx cap sync android

      # 6.5) [v2.81.3] أيقونة التطبيق وشاشة البدء من لوغو المنصة — كان القالب
      #      يخرج بأيقونة Capacitor الافتراضية (روبوت) فلا يحمل التطبيق شعار
      #      المنصة. @capacitor/assets يقرأ resources/icon.png وresources/splash.png
      #      (مُلزَمان في المستودع) ويكتب res/mipmap* وres/drawable* داخل android/.
      #      [إصلاح بناء #2 الفاشل] تثبيت الأداة في جذر المساحة كان يعبث بnode_modules
      #      بعد cap add (npm أزال 3 حزم وغيّر 14) فانكسر :capacitor-android
      #      أمام Gradle («None of the consumable configurations have attributes»)
      #      ⇒ التثبيت الآن معزول في /tmp/capassets: حزم المساحة لا تُمسّ بعد cap add.
      # 6.5) [v2.83·إصلاح ميداني] أيقونة بلا حاوية: لوغو كبير شفاف على طبقات
      #      تكيفية شفافة بالكامل — كان السير يمرر --iconBackgroundColor '#0b1526'
      #      فتظهر أيقونة «لوغو صغير داخل مربع أسود» (بلاغ المالك 2026-10-05).
      #      الآن: resources/icon-foreground.png (لوغو 76% شفاف) + icon-background.png
      #      (شفافة 100%) تُستخدمان للطبقات التكيفية، وicon.png نفسه صار اللوغو
      #      الكبير الشفاف (الأيقونات القديمة + المتجر). ألوان الخلفية أُبقيت
      #      لشاشة البدء حصراً — لا علاقة لها بالأيقونة بعد الآن.
      - name: Generate app icons + splash from platform logo
        run: |
          mkdir -p /tmp/capassets
          ( cd /tmp/capassets && npm init -y >/dev/null && npm install @capacitor/assets@3 )
          /tmp/capassets/node_modules/.bin/capacitor-assets generate --android --assetPath resources \
            --splashBackgroundColor '#0b1526' --splashBackgroundColorDark '#0b1526'

      # 7) Java 17 (OpenJDK) المتوافق تماماً مع Gradle/Capacitor 6 + كاش Gradle
      #    (المستند §ب-5)
      # 8.4) [v2.83·LocalMP] إذن الكاميرا لمسح رموز QR في الغرفة المحلية —
      #      قالب Capacitor لا يضم CAMERA أصلاً فماسح الرموز يحتاجه (getUserMedia).
      #      python3 بمرساة إذن INTERNET القياسية وفشل صريح إن تغيّر القالب.
      - name: Inject CAMERA permission for local-room QR scanning
        run: |
          python3 - <<'PY2'
          import io, sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = io.open(p, encoding="utf-8").read()
          if "android.permission.CAMERA" in s:
              print("✓ إذن الكاميرا موجود مسبقاً"); sys.exit(0)
          anchor = "<uses-permission android:name=\"android.permission.INTERNET\" />"
          if anchor not in s:
              sys.exit("✗ قالب AndroidManifest تغيّر: لم أجد مرساة INTERNET — راجع خطوة الحقن (8.4)")
          s = s.replace(anchor, anchor + "\n    <uses-permission android:name=\"android.permission.CAMERA\" /> <!-- [v2.83] LocalMP QR -->", 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("✓ أُضيف إذن CAMERA لمسح رموز الغرفة المحلية")
          PY2

      # 8.5) [v2.85·Android] ملء الشاشة 100% (edge-to-edge) — بلاغ المالك
      #      2026-10-06: «التطبيق لا يملئ الشاشة، شريط أعلى وأسفل يفسدان
      #      المظهر». الجذر: قالب Capacitor يلوّن شريطي النظام فلا يمتد الويب
      #      خلفهما. الإصلاح ثلاثي: ① styles.xml يجعل الشريطين شفافين مع
      #      shortEdges (لا أشرطة سوداء عند النوتش/اللاندسكيب). ② MainActivity
      #      يحقن جسر DTSGNative: getInsets() يعيد "top|bottom" (systemBars
      #      حصراً — بلا IME) تسحبه الصفحة وتضبط --safe-top/--safe-bottom
      #      (كل الكروم يستعمل المتغيرين)، وpushInsets من جافا عند كل تغيّر
      #      (دوران/تغيّر شريط التنقل)، وsetBarsLight يتبع ثيم المنصة لأيقونات
      #      الشريطين (تستدعيه updateThemeIcon في utils.js). ③ الصفحة:
      #      viewport-fit=cover موجود أصلاً وenv() هي الافتراض.
      #      python3 بمرساة نصية دقيقة وفشل صريح إن تغيّر القالب (نمط 8.4).
      - name: Edge-to-edge fullscreen + native safe-area bridge (status/nav bars)
        run: |
          python3 - <<'PY3'
          import io, sys

          # ① styles.xml — شريطا النظام شفافان من الثيم نفسه
          p = "android/app/src/main/res/values/styles.xml"
          s = io.open(p, encoding="utf-8").read()
          if "windowDrawsSystemBarBackgrounds" in s:
              print("styles: edge-to-edge موجود مسبقاً")
          else:
              a = '        <item name="android:background">@null</item>\n    </style>'
              if a not in s:
                  sys.exit("X قالب styles.xml تغيّر: لم أجد مرساة AppTheme.NoActionBar — راجع خطوة الحقن (8.5)")
              r = ('        <item name="android:background">@null</item>\n'
                   '        <!-- [v2.85] ملء الشاشة 100%: شريطا النظام شفافان والويب يرسم خلفهما -->\n'
                   '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n'
                   '        <item name="android:statusBarColor">@android:color/transparent</item>\n'
                   '        <item name="android:navigationBarColor">@android:color/transparent</item>\n'
                   '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n'
                   '    </style>')
              s = s.replace(a, r, 1)
              io.open(p, "w", encoding="utf-8").write(s)
              print("OK styles.xml: الشريطان شفافان + shortEdges (ملء الشاشة حافة-لحافة)")

          # ② MainActivity.java — جسر الكروم الأصلي
          p2 = "android/app/src/main/java/com/dtsg/app/MainActivity.java"
          s2 = io.open(p2, encoding="utf-8").read()
          if "DTSGNative" in s2:
              print("MainActivity: الجسر موجود مسبقاً"); sys.exit(0)
          tpl = 'package com.dtsg.app;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {}'
          if s2.strip() != tpl.strip():
              sys.exit("X قالب MainActivity تغيّر: لم أجد الصنف الفارغ المتوقع — راجع خطوة الحقن (8.5)")
          new = '''package com.dtsg.app;
          
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.BridgeActivity;
          
          /* [v2.85] ملء الشاشة 100% (edge-to-edge) + جسر safe-area للويب — يُحقن من
             سير البناء (خطوة 8.5). الشريطان شفافان والويب يرسم خلفهما، والمساحات
             الآمنة تُدفع للصفحة (متغيرا --safe-top/--safe-bottom) وتُسحب أيضاً من
             getInsets() بصيغة "top|bottom"، وsetBarsLight يتبع ثيم المنصة لأيقونات
             الشريطين (فاتحة فوق الكحلي / داكنة فوق العاجي). */
          public class MainActivity extends BridgeActivity {
              private volatile int insetTop = 0;
              private volatile int insetBottom = 0;
              private volatile boolean barsLight = false;
              private boolean jsBound = false;
          
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  w.setStatusBarColor(android.graphics.Color.TRANSPARENT);
                  w.setNavigationBarColor(android.graphics.Color.TRANSPARENT);
                  try {
                      w.getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  } catch (Throwable ignored) { }
                  try {
                      w.getDecorView().setOnApplyWindowInsetsListener((v, insets) -> {
                          cacheInsets(insets);
                          pushInsetsToPage();
                          return insets;
                      });
                  } catch (Throwable ignored) { }
                  bindJsInterface();
                  applyBarsAppearance();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  bindJsInterface();
                  pushInsetsToPage();
                  applyBarsAppearance();
              }
          
              /* systemBars حصراً (بلا IME): stable insets قبل API 30 — قيم الشريطين
                 نفسها التي يجب أن يحترمها الكروم، ولا تتغير بفتح لوحة المفاتيح. */
              private void cacheInsets(android.view.WindowInsets insets) {
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets sb =
                              insets.getInsets(android.view.WindowInsets.Type.systemBars());
                          insetTop = Math.max(0, sb.top);
                          insetBottom = Math.max(0, sb.bottom);
                      } else {
                          insetTop = Math.max(0, insets.getStableInsetTop());
                          insetBottom = Math.max(0, insets.getStableInsetBottom());
                      }
                  } catch (Throwable ignored) { }
              }
          
              private void pushInsetsToPage() {
                  try {
                      final Bridge b = getBridge();
                      if (b == null || b.getWebView() == null) return;
                      final String js = "try{var r=document.documentElement.style;" +
                          "r.setProperty('--safe-top','" + insetTop + "px');" +
                          "r.setProperty('--safe-bottom','" + insetBottom + "px');}catch(e){}";
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              try { b.getWebView().evaluateJavascript(js, null); } catch (Throwable ignored) { }
                          }
                      });
                  } catch (Throwable ignored) { }
              }
          
              private void bindJsInterface() {
                  try {
                      Bridge b = getBridge();
                      if (b == null || b.getWebView() == null || jsBound) return;
                      b.getWebView().addJavascriptInterface(new NativeChrome(), "DTSGNative");
                      jsBound = true;
                  } catch (Throwable ignored) { }
              }
          
              private void applyBarsAppearance() {
                  try {
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              try {
                                  View d = getWindow().getDecorView();
                                  int flags = d.getSystemUiVisibility();
                                  final int LIGHT_STATUS = 0x00002000; /* SYSTEM_UI_FLAG_LIGHT_STATUS_BAR */
                                  final int LIGHT_NAV = 0x00000010;    /* SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR */
                                  if (barsLight) flags |= LIGHT_STATUS | LIGHT_NAV;
                                  else flags &= ~(LIGHT_STATUS | LIGHT_NAV);
                                  d.setSystemUiVisibility(flags);
                              } catch (Throwable ignored) { }
                          }
                      });
                  } catch (Throwable ignored) { }
              }
          
              /* جسر JS إلى Java: استعلام متزامن للمساحات (top|bottom) + ضبط أيقونات الشريطين */
              private class NativeChrome {
                  @android.webkit.JavascriptInterface
                  public String getInsets() {
                      return insetTop + "|" + insetBottom;
                  }
                  @android.webkit.JavascriptInterface
                  public void setBarsLight(boolean light) {
                      barsLight = light;
                      applyBarsAppearance();
                  }
              }
          }
          '''
          io.open(p2, "w", encoding="utf-8").write(new)
          print("OK MainActivity: جسر DTSGNative (getInsets + setBarsLight) + أشرطة شفافة")
          PY3

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 8.1) [v2.82] فحص أسرار التوقيع **قبل أي عمل ثقيل** — فشل فوري برسالة
      #      واضحة بدل انهيار Gradle غامض بعد دقائق. الأسرار الأربعة تُضبط
      #      مرة واحدة في Settings ⇒ Secrets and variables ⇒ Actions
      #      (القيم والتعليمات مع المالك — لا تُكتب في المستودع أبداً، قاعدة 5).
      - name: Verify signing secrets are configured (fail fast)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "✗ السر $v غير مضبوط (Settings ⇒ Secrets and variables ⇒ Actions)"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "إعداد لمرة واحدة: أضِف الأسرار الأربعة أعلاه (شهادة توقيع"
            echo "الإنتاج بـBase64 + كلمة السر + الاسم المستعار) ثم أعد"
            echo "تشغيل الـWorkflow (Re-run). تفاصيل: docs/APK_BUILD.md §6"
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✓ أسرار التوقيع الأربعة موجودة"

      # 8.2) [v2.82] فك ترميز شهادة الإنتاج (Base64 ⇒ ملف) والتحقق منها بمفتاح
      #      Java **قبل البناء**: كلمة السر صحيحة + الاسم المستعار موجود، ويُطبع
      #      صاحب الشهادة وتاريخ انتهائها (30 سنة) في السجل. الملف يُكتب في
      #      $RUNNER_TEMP خارج المستودع ولا يُرفع ولا يُطبع محتواه أبداً.
      - name: Decode production keystore + verify with keytool
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/dtsg-production.keystore"
          KEYTOOL_INFO="$(keytool -list -v -keystore "$RUNNER_TEMP/dtsg-production.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")" || {
            echo "✗ الشهادة لا تُفتح بالسرّ/الاسم المستعار المُمرَّر — راجع قيم الأسرار الثلاثة"; exit 1; }
          echo "$KEYTOOL_INFO" | grep -E 'Owner:|Valid from' || true
          echo "✓ شهادة الإنتاج جاهزة: alias=$ANDROID_KEY_ALIAS (30 سنة) — $RUNNER_TEMP/dtsg-production.keystore"

      # 8.3) [v2.82] حقن توقيع الإنتاج في build.gradle المولَّد حديثاً: قالب
      #      Capacitor 6 **لا يعرّف signingConfig للإصدار أصلاً** (فحص قالب
      #      6.2.2) — فتُخرج assembleRelease ملفاً غير موقَّع. الحقن: كتلة
      #      signingConfigs.dtsgRelease تقرأ الشهادة من متغيرات البيئة + سطر
      #      signingConfig داخل buildTypes.release. ويُستثمار نفس الخطوة لكتابة
      #      إصدار الحزمة وversionCode (رقم التشغيل — يزداد رتيباً) داخل الـAPK
      #      بدل 1.0/1 القالبية. python3 بدل sed: مطابقة نصية دقيقة وفشل صريح
      #      إن تغيّر القالب مستقبلاً.
      - name: Inject production signingConfig + app version into generated build.gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_VERSION="$PKG_VERSION" VERSION_CODE="$VERSION_CODE" python3 - <<'PY'
          import io, os, sys
          p = "android/app/build.gradle"
          s = io.open(p, encoding="utf-8").read()
          sig_cfg = (
              "    signingConfigs {\n"
              "        dtsgRelease {\n"
              "            storeFile file(System.getenv(\"ANDROID_KEYSTORE_FILE\"))\n"
              "            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n"
          )
          old = "    buildTypes {\n        release {\n"
          if old not in s:
              sys.exit("✗ قالب build.gradle تغيّر: لم أجد مرساة buildTypes — راجع خطوة الحقن (8.3)")
          s = s.replace(old, sig_cfg + old, 1)
          s = s.replace("        release {\n",
                        "        release {\n            signingConfig signingConfigs.dtsgRelease // [v2.82] توقيع إنتاجي بشهادة المالك (CI)\n", 1)
          if 'versionCode 1\n' not in s or 'versionName "1.0"' not in s:
              sys.exit("✗ قالب build.gradle تغيّر: لم أجد versionCode/versionName القالبية")
          s = s.replace("versionCode 1\n", "versionCode " + os.environ["VERSION_CODE"] + "\n", 1)
          s = s.replace('versionName "1.0"', 'versionName "' + os.environ["PKG_VERSION"] + '"', 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("✓ signingConfig dtsgRelease + version " + os.environ["PKG_VERSION"]
                + " (" + os.environ["VERSION_CODE"] + ") حُقنت — الإصدار يُوقَّع بشهادة المالك")
          PY

      # 8) بناء APK إصدار موقَّع [v2.82] — كان assembleDebug بشهادة debug
      #    الافتراضية: صلاحية تنفيذ للـ wrapper ثم assembleRelease بلا دايمون
      #    (بيئة CI نظيفة بلا عمليات عالقة)، والشهادة تُمرَّر بالبيئة حصراً.
      - name: Gradle assembleRelease (signed with production keystore)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dtsg-production.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      # 9) [v2.82] تحقق مستقل من التوقيع بعد البناء: apksigner يفحص الـAPK
      #    ويجب أن يكون الموقِّع شهادة الإنتاج (CN=DTSG…) — لا debug ولا غير
      #    موقَّع. فشل هنا = البناء كله يفشل قبل أي نشر.
      - name: Verify APK signature is the production cert (apksigner)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "✗ $APK غير موجود — راجع سجل Gradle"; exit 1; }
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          echo "$CERTS" | grep -q 'CN=DTSG' || { echo "✗ الموقِّع ليس شهادة الإنتاج (CN=DTSG…) — يُمنع النشر"; exit 1; }
          echo "✓ الـAPK موقَّع بشهادة الإنتاج (DTSG) — التوقيع صحيح"

      # 9.5) [v2.82] تجهيز ملف التحميل النهائي باسمه الثابت + بصمة SHA-256
      #      (البصمة تُنشر مع الإصدار ليتحقق المالك من سلامة التنزيل)
      - name: Stage APK with stable name + SHA-256 checksum
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/${APK_NAME}.apk"
          sha256sum "$RUNNER_TEMP/${APK_NAME}.apk" > "$RUNNER_TEMP/${APK_NAME}.apk.sha256"
          echo "-- SHA-256 --"; cat "$RUNNER_TEMP/${APK_NAME}.apk.sha256"

      # 9.7) Artifact احتياطي (7 أيام) — طريقة الوصول الأولى هي الـRelease
      #      أدناه (تحميل مباشر بلا ZIP). الـArtifact للطوارئ/التشخيص فقط.
      - name: Upload APK artifact (backup — official download is the Release)
        uses: actions/upload-artifact@v4
        with:
          name: DSTG-Gaming-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # 10) [v2.82] نشر GitHub Release: الوسم apk-v<الإصدار>-build<رقم التشغيل>
      #     فريد لكل تشغيل، والعلم --latest يجعله «أحدث إصدار» ⇒ رابط
      #     /releases/latest/download/ يخدم آخر APK دائماً. الملفان يُرفعان
      #     **كأصلين مباشرين** (apk + sha256) — بلا ضغط ZIP. وإعادة تشغيل
      #     نفس التشغيل تُنظف وسم/إصدار سابقاً نصف مكتمل ثم تعيد الإنشاء.
      - name: Publish GitHub Release (direct APK download)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="apk-v${VERSION}-build${RUN_NUMBER}"
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          ## DTSG Android App v${VERSION} (بناء #${RUN_NUMBER})

          - **الملف:** ${APK_NAME}.apk — توقيع إنتاجي بشهادة المالك (صلاحية 30 سنة)
          - **الكود:** ${SHORT_SHA} (${COMMIT_SHA}) — ${STAMP}
          - **الإصدار داخل التطبيق:** ${VERSION} · versionCode ${RUN_NUMBER}
          - **التحقق من السلامة:** بصمة SHA-256 مرفقة (${APK_NAME}.apk.sha256)

          ### رابط التحميل المباشر الدائم (أحدث إصدار دائماً)
          https://github.com/tarikchouika/DTSG/releases/latest/download/${APK_NAME}.apk

          ### التثبيت
          1. نزّل الملف إلى هاتف الأندرويد.
          2. انقره ⇒ اسمح بالتثبيت «من مصادر غير معروفة» لهذا المدير إن طُلب ⇒ تثبيت.
          3. **من نسخة Debug القديمة:** احذف التطبيق القديم أولاً — التوقيعان مختلفان
             والأندرويد يمنع التحديث فوق توقيع مغاير. من إصدار إنتاج سابق يتحدث مباشرة.
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            "$RUNNER_TEMP/${APK_NAME}.apk" \
            "$RUNNER_TEMP/${APK_NAME}.apk.sha256" \
            --title "DTSG Android App v${VERSION} (build ${RUN_NUMBER})" \
            --notes-file "$NOTES" \
            --latest
          echo "✓ نُشر Release ${TAG} — التحميل المباشر: https://github.com/tarikchouika/DTSG/releases/latest/download/${APK_NAME}.apk"
