                              insets.getInsets(android.view.WindowInsets.Type.systemBars());
                          top = Math.max(0, sb.top);
                          bottom = Math.max(0, sb.bottom);
                      } else {
                          top = Math.max(0, insets.getStableInsetTop());
                          bottom = Math.max(0, insets.getStableInsetBottom());
                      }
                      if (android.os.Build.VERSION.SDK_INT >= 28) {
                          android.view.DisplayCutout dc = insets.getDisplayCutout();
                          if (dc != null) cutTop = Math.max(0, dc.getSafeInsetTop());
