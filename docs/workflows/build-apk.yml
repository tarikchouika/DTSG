                      float density = 1f;
                      try { density = getResources().getDisplayMetrics().density; } catch (Throwable ignored2) { }
                      if (density <= 0f) density = 1f;
                      insetTop = Math.round(Math.max(top, cutTop) / density);
                      insetBottom = Math.round(bottom / density);
                  } catch (Throwable ignored) { }
              }
          
