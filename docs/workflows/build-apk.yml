                          si.setAttribute("max", String.valueOf(hostMax));
                          si.setAttribute("players", String.valueOf(hostPlayers));
                          nsdReg = new NsdManager.RegistrationListener() {
                              @Override public void onServiceRegistered(NsdServiceInfo s) { }
                              @Override public void onRegistrationFailed(NsdServiceInfo s, int e) { }
                              @Override public void onServiceUnregistered(NsdServiceInfo s) { }
                              @Override public void onUnregistrationFailed(NsdServiceInfo s, int e) { }
                          };
                          m.registerService(si, NsdManager.PROTOCOL_DNS_SD, nsdReg);
                      } catch (Throwable ignored) { }
                  }
                  /* مستمع RFCOMM (مرة واحدة) + إعلان BLE — يُعاد عند توفر الأذونات */
                  void ensureBtHost() {
                      try {
                          if (!hosting.get() || !btOn() || !btPermsGranted()) return;
                          BluetoothAdapter ada = btAdapter();
                          if (btServer == null && ada != null) {
                              btServer = ada.listenUsingInsecureRfcommWithServiceRecord("DTSG", DTSG_UUID);
                              acceptBtLoop();
                          }
                          if (bleAdv == null || advCb == null) {
                              bleAdv = ada.getBluetoothLeAdvertiser();
                              if (bleAdv != null) bleAdvertise();
                          }
                      } catch (Throwable ignored) { }
                  }
                  void acceptBtLoop() {
                      final BluetoothServerSocket bs = btServer;
                      if (bs == null) return;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              while (hosting.get()) {
                                  try {
                                      BluetoothSocket s = bs.accept();
                                      if (!hosting.get()) { try { s.close(); } catch (Throwable ignored) { } continue; }
                                      Integer id = Integer.valueOf(linkSeq.getAndIncrement());
                                      Link l = new BtLink(s);
                                      links.put(id, l);
                                      pumpRead(id, l);
                                      pushEventId("peerOpen", id.intValue());
                                  } catch (Throwable t) {
                                      if (!hosting.get()) return;
                                  }
                              }
                          }
                      }, "ln-bt-accept").start();
                  }
                  byte[] advPayload() {
                      try {
                          byte[] g = hostGame.getBytes(StandardCharsets.UTF_8);
                          if (g.length > 6) g = Arrays.copyOf(g, 6);
                          byte[] p = new byte[1 + 8 + 1 + g.length + 1];
                          p[0] = 1;                                   /* نسخة الحزمة */
                          byte[] c = hostCode.getBytes(StandardCharsets.UTF_8);
                          for (int i = 0; i < 8 && i < c.length; i++) p[1 + i] = c[i];
                          p[9] = (byte) g.length;
                          System.arraycopy(g, 0, p, 10, g.length);
                          p[10 + g.length] = (byte) hostPlayers;
                          return p;
                      } catch (Throwable t) { return new byte[] { 1 }; }
                  }
                  void bleAdvertise() {
                      try {
                          if (bleAdv == null) return;
                          AdvertiseSettings st = new AdvertiseSettings.Builder()
                              .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_BALANCED)
                              .setConnectable(false)
                              .setTimeout(0)
                              .build();
                          AdvertiseData data = new AdvertiseData.Builder()
                              .addManufacturerData(MANUF_ID, advPayload())
                              .setIncludeDeviceName(false)
                              .setIncludeTxPowerLevel(false)
                              .build();
                          advCb = new AdvertiseCallback() { };
                          bleAdv.startAdvertising(st, data, advCb);
                      } catch (Throwable ignored) { }
                  }
                  void stopBleAdvertise() {
                      try {
                          if (bleAdv != null && advCb != null) bleAdv.stopAdvertising(advCb);
                      } catch (Throwable ignored) { }
                      bleAdv = null; advCb = null;
                  }
                  /* تحديث عدد اللاعبين في الإعلانات (NSD يُعاد تسجيله · BLE يُعاد بثّه) */
                  void hostUpdate(String json) {
                      try {
                          JSONObject o = new JSONObject(json == null ? "{}" : "{}");
                          hostPlayers = Math.max(1, Math.min(6, o.optInt("players", hostPlayers)));
                      } catch (Throwable ignored) { }
                      if (!hosting.get()) return;
                      try {
                          if (nsdReg != null && nsd() != null) {
                              NsdManager.RegistrationListener old = nsdReg;
                              try { nsd().unregisterService(old); } catch (Throwable ignored) { }
                              nsdReg = null;
                              registerNsd();
                          }
                          stopBleAdvertise();
                          ensureBtHost();
                      } catch (Throwable ignored) { }
                  }
          
                  /* ── الضيف: الاكتشاف الآلي (NSD + BLE) ── */
                  void discoverStart(String json) {
                      boolean wantBt = false;
                      try {
                          JSONObject o = new JSONObject(json == null ? "{}" : "{}");
                          wantBt = o.optBoolean("bt", false);
                      } catch (Throwable ignored) { }
                      if (wantBt) requestBtPerms();          /* طلب سياقي — مرة واحدة */
                      try {
                          NsdManager m = nsd();
                          if (m != null && !discovering.get()) {
                              discovering.set(true);
                              nsdDisc = new NsdManager.DiscoveryListener() {
                                  @Override public void onStartDiscoveryFailed(String t, int e) { discovering.set(false); }
                                  @Override public void onStopDiscoveryFailed(String t, int e) { }
                                  @Override public void onDiscoveryStarted(String t) { }
                                  @Override public void onDiscoveryStopped(String t) { }
                                  @Override public void onServiceFound(NsdServiceInfo s) {
                                      if (s.getServiceType() != null && s.getServiceType().contains("dtsg")) enqueueResolve(s);
                                  }
                                  @Override public void onServiceLost(NsdServiceInfo s) {
                                      pushSimple("roomGone", "name", s.getServiceName() == null ? "" : s.getServiceName());
                                  }
                              };
                              m.discoverServices(NSD_TYPE, NsdManager.PROTOCOL_DNS_SD, nsdDisc);
                          }
                      } catch (Throwable ignored) { }
                      if (wantBt) startBleScan();
                  }
                  void discoverStop() {
                      try {
                          if (nsd != null && nsdDisc != null) nsd.stopServiceDiscovery(nsdDisc);
                      } catch (Throwable ignored) { }
                      nsdDisc = null;
                      discovering.set(false);
                      stopBleScan();
                      resolveQ.clear();
                  }
                  void enqueueResolve(NsdServiceInfo svc) {
                      resolveQ.add(svc);
                      drainResolve();
                  }
                  void drainResolve() {
                      if (!resolving.compareAndSet(false, true)) return;
                      NsdServiceInfo svc = resolveQ.poll();
                      if (svc == null) {
                          resolving.set(false);
                          if (!resolveQ.isEmpty()) drainResolve();   /* نافذة سباق مغلقة */
                          return;
                      }
                      try {
                          nsd().resolveService(svc, new NsdManager.ResolveListener() {
                              @Override public void onResolveFailed(NsdServiceInfo s, int e) {
                                  resolving.set(false);
                                  drainResolve();
                              }
                              @Override public void onServiceResolved(NsdServiceInfo info) {
                                  try {
                                      String code = attr(info, "code");
                                      if (code.length() == 8 && info.getHost() != null) {
                                          pushRoom(code, attr(info, "game"), attr(info, "name"),
                                              safeInt(attr(info, "max"), 4), safeInt(attr(info, "players"), 1),
                                              info.getHost().getHostAddress(), info.getPort(), null, "wifi");
                                      }
                                  } catch (Throwable ignored) { }
                                  resolving.set(false);
                                  drainResolve();
                              }
                          });
                      } catch (Throwable t) {
                          resolving.set(false);
                          drainResolve();
                      }
                  }
                  void startBleScan() {
                      try {
                          if (Build.VERSION.SDK_INT < 21) return;
                          if (!btPermsGranted() || !btOn()) return;
                          BluetoothAdapter ada = btAdapter();
                          if (ada == null) return;
                          if (bleScanner != null && scanCb != null) return;   /* يعمل أصلاً */
                          bleScanner = ada.getBluetoothLeScanner();
                          if (bleScanner == null) return;
                          scanCb = new ScanCallback() {
                              @Override public void onScanResult(int cb, ScanResult result) {
                                  try {
                                      ScanRecord rec = result.getScanRecord();
                                      if (rec == null) return;
                                      byte[] p = rec.getManufacturerSpecificData(MANUF_ID);
                                      if (p == null || p.length < 10) return;
                                      String code = new String(p, 1, 8, StandardCharsets.UTF_8).trim();
                                      if (code.length() != 8) return;
                                      long now = android.os.SystemClock.elapsedRealtime();
                                      Long last = bleSeen.get(code);
                                      if (last != null && now - last < 2500) return;   /* مضاد للتكرار */
                                      bleSeen.put(code, now);
                                      int gl = p[9] & 0xFF;
                                      String game = gl > 0 && 10 + gl <= p.length
                                          ? new String(p, 10, gl, StandardCharsets.UTF_8) : "";
                                      int players = (10 + gl < p.length) ? (p[10 + gl] & 0xFF) : 1;
                                      pushRoom(code, game, "", 4, Math.max(1, players),
                                          null, 0, result.getDevice().getAddress(), "bt");
                                  } catch (Throwable ignored) { }
                              }
                              @Override public void onScanFailed(int e) { }
                          };
                          List<ScanFilter> fl = new ArrayList<ScanFilter>();
                          fl.add(new ScanFilter.Builder()
                              .setManufacturerData(MANUF_ID, new byte[0], new byte[0])
                              .build());
                          ScanSettings st = new ScanSettings.Builder()
                              .setScanMode(ScanSettings.SCAN_MODE_BALANCED)
                              .build();
                          bleScanner.startScan(fl, st, scanCb);
                      } catch (Throwable ignored) { }
                  }
                  void stopBleScan() {
                      try {
                          if (bleScanner != null && scanCb != null) bleScanner.stopScan(scanCb);
                      } catch (Throwable ignored) { }
                      bleScanner = null; scanCb = null;
                  }
          
                  /* ── الضيف: الانضمام (TCP أو RFCOMM — مباشرة بالراديو) ── */
                  void join(String json) {
                      String code = "", ip = "", mac = "";
                      int port = 0;
                      try {
                          JSONObject o = new JSONObject(json == null ? "" : json);
                          code = o.optString("code", "");
                          ip = o.optString("ip", "");
                          mac = o.optString("mac", "");
                          port = o.optInt("port", 0);
                      } catch (Throwable ignored) { }
                      final String fCode = code, fIp = ip, fMac = mac;
                      final int fPort = port;
                      if (!joining.compareAndSet(false, true)) return;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try {
                                  leave();
                                  Link l = null;
                                  if (fMac.length() >= 12 && btPermsGranted()) {
                                      try {
                                          BluetoothAdapter ada = btAdapter();
                                          if (ada != null && ada.isEnabled()) {
                                              BluetoothDevice dev = ada.getRemoteDevice(fMac);
                                              BluetoothSocket s = dev.createInsecureRfcommSocketToServiceRecord(DTSG_UUID);
                                              s.connect();
                                              l = new BtLink(s);
                                          }
                                      } catch (Throwable t) { l = null; }
                                  }
                                  if (l == null && fIp.length() > 6 && fPort > 0) {
                                      Socket s = new Socket();
                                      s.connect(new InetSocketAddress(fIp, fPort), 6000);
                                      try { s.setTcpNoDelay(true); } catch (Throwable ignored) { }
                                      l = new TcpLink(s);
                                  }
                                  if (l == null) {
                                      joining.set(false);
                                      pushSimple("joinErr", "err", "connect");
                                      return;
                                  }
                                  Integer zero = Integer.valueOf(0);
                                  links.put(zero, l);
                                  pumpRead(zero, l);
                                  try {
                                      pushEvent(new JSONObject().put("t", "joined")
                                          .put("code", fCode).put("kind", l.kind()).toString());
                                  } catch (Throwable ignored) { }
                                  joining.set(false);
                              } catch (Throwable t) {
                                  joining.set(false);
                                  pushSimple("joinErr", "err", String.valueOf(t));
                              }
                          }
                      }, "ln-join").start();
                  }
          
                  /* ── التفكيك الكامل ── */
                  void leave() {
                      hosting.set(false);
                      for (Map.Entry<Integer, Link> e : links.entrySet()) {
                          try { e.getValue().close(); } catch (Throwable ignored) { }
                      }
                      links.clear();
                      try { if (tcpServer != null) tcpServer.close(); } catch (Throwable ignored) { }
                      tcpServer = null;
                      try { if (btServer != null) btServer.close(); } catch (Throwable ignored) { }
                      btServer = null;
                      try {
                          if (nsd != null && nsdReg != null) nsd.unregisterService(nsdReg);
                      } catch (Throwable ignored) { }
                      nsdReg = null;
                      try {
                          if (nsd != null && nsdDisc != null) nsd.stopServiceDiscovery(nsdDisc);
                      } catch (Throwable ignored) { }
                      nsdDisc = null;
                      discovering.set(false);
                      stopBleAdvertise();
                      stopBleScan();
                      resolveQ.clear();
                      bleSeen.clear();
                  }
              }
          
              /* ═══════════════════════════════════════════════════════════════════
                 [v2.88·التحكيم] ArbShare — مشاركة شاشة التطبيق إلى لوحة التحكيم
                 ─────────────────────────────────────────────────────────────────
                 بلاغ المالك 2026-10-06: «التطبيق لا يسمح بمشاركة الشاشة في غرف
                 التحكيم». الجذر: WebView لا يوفّر getDisplayMedia أصلاً (قيد
                 منصّي موثّق منذ v2.78) فكان الزر محجوباً والبديل الوحيد تطبيق
                 خارجي (Larix). العلاج: إذن إسقاط الشاشة من النظام (MediaProjection)
                 → VirtualDisplay فوق سطح مُرمِّز H.264 (MediaCodec) → ناشر RTMP
                 مصغّر مكتوب هنا حصراً بلا مكتبات → مرحّل MediaMTX نفسه الذي ينشر
                 إليه Larix (rtmp://.../dtsg/<roomId>/<uid>_<token> بالمسار الموقّع
                 من الخادم) — فالمراقبة والحسم ومشاهدة الأدمن تعمل بعقدها القائم
                 دون أي تغيير خادمي، والبث يظهر في لوحة الأدمن آلياً.
                 فيديو حصراً (بلا صوت): كافٍ للحسم وأخف على الهاتف والشبكة.
                 كل شيء داخل try/catch(Throwable) — أي عطل يعود للصفحة حدثاً ولن
                 يُسقط التطبيق أبداً. بلا أي شرطة مائلة عكسية (قيد سلسلة الحقن).
                 ═══════════════════════════════════════════════════════════════ */
              private class ArbShare {
                  volatile String pendingUrl = null;   /* rtmp://host:port */
                  volatile String pendingPath = null;  /* dtsg/..._<token> */
                  volatile boolean running = false;
                  MediaProjection projection = null;
                  VirtualDisplay display = null;
                  MediaCodec encoder = null;
                  RtmpLink link = null;
                  Thread encThread = null;
                  long firstPts = -1;
          
                  /* البدء من الجسر: {url, path} — كلاهما من الخادم (لا يُركَّب محلياً) */
                  void start(String json) {
                      if (running) { push("state", "live", null); return; }
                      String url = null, path = null;
                      try {
                          JSONObject j = new JSONObject(json == null ? "" : json);
                          url = j.optString("url", "");
                          path = j.optString("path", "");
                      } catch (Throwable t) { push("state", "failed", "bad-json"); return; }
                      if (url.indexOf("rtmp://") != 0 || path.length() < 3) {
                          push("state", "failed", "bad-url");
                          return;
                      }
                      pendingUrl = url;
                      pendingPath = path;
                      try {
                          final MediaProjectionManager mpm =
                              (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          if (mpm == null) { push("state", "failed", "no-mgr"); return; }
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  try {
                                      /* إذن الإشعارات (API 33+) — رفضه لا يمنع البث */
                                      if (android.os.Build.VERSION.SDK_INT >= 33) {
                                          try {
                                              if (androidx.core.content.ContextCompat.checkSelfPermission(MainActivity.this,
                                                  android.Manifest.permission.POST_NOTIFICATIONS)
                                                  != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                                  androidx.core.app.ActivityCompat.requestPermissions(MainActivity.this,
                                                      new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 4289);
                                              }
                                          } catch (Throwable ignored) { }
                                      }
                                      startActivityForResult(mpm.createScreenCaptureIntent(), 4288);
                                  } catch (Throwable t) { push("state", "failed", "intent"); }
                              }
                          });
                          push("state", "connecting", null);
                      } catch (Throwable t) {
                          push("state", "failed", "start");
                      }
                  }
          
                  /* نتيجة إذن الإسقاط: الخدمة الأمامية أولاً (إلزام API 29+) ثم البدء */
                  void onPermissionResult(int resultCode, android.content.Intent data) {
                      if (resultCode != android.app.Activity.RESULT_OK || data == null) {
                          push("state", "failed", "denied");
                          pendingUrl = null;
                          pendingPath = null;
                          return;
                      }
                      try {
                          android.content.Intent svc = new android.content.Intent(MainActivity.this, ArbShareService.class);
                          svc.putExtra("code", resultCode);
                          svc.putExtra("data", (android.os.Parcelable) data);
                          androidx.core.content.ContextCompat.startForegroundService(MainActivity.this, svc);
                      } catch (Throwable t) {
                          push("state", "failed", "service");
                      }
                  }
          
                  /* الخدمة جاهزة (الإشعار ظاهر) → الإسقاط والترميز والنشر */
                  void beginProjection(int resultCode, android.content.Intent data) {
                      if (running) return;
                      final String url = pendingUrl, path = pendingPath;
                      pendingUrl = null;
                      pendingPath = null;
                      if (url == null || path == null) { push("state", "failed", "no-target"); return; }
                      try {
                          MediaProjectionManager mpm =
                              (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          projection = mpm.getMediaProjection(resultCode, data);
                          if (projection == null) { push("state", "failed", "no-proj"); return; }
                          /* أبعاد الشاشة مع سقف 1280 للحافة الكبرى — بث خفيف ثابت */
                          DisplayMetrics dm = new DisplayMetrics();
                          try {
                              if (android.os.Build.VERSION.SDK_INT >= 30) {
                                  android.graphics.Rect r = getWindowManager().getCurrentWindowMetrics().getBounds();
                                  dm.widthPixels = r.width();
                                  dm.heightPixels = r.height();
                                  dm.densityDpi = getResources().getDisplayMetrics().densityDpi;
                              } else {
                                  getWindowManager().getDefaultDisplay().getRealMetrics(dm);
                              }
                          } catch (Throwable ignored) { }
                          int w = Math.max(320, dm.widthPixels), h = Math.max(240, dm.heightPixels);
                          if (Math.max(w, h) > 1280) {
                              double k = 1280.0 / (double) Math.max(w, h);
                              w = (int) Math.round(w * k);
                              h = (int) Math.round(h * k);
                          }
                          w = (w / 2) * 2;
                          h = (h / 2) * 2;
                          int bitrate = Math.max(900000, Math.min(2400000, w * h * 2));
                          MediaFormat fmt = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, w, h);
                          fmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                          fmt.setInteger(MediaFormat.KEY_BIT_RATE, bitrate);
                          fmt.setInteger(MediaFormat.KEY_FRAME_RATE, 24);
                          fmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 2);
                          encoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC);
                          encoder.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                          Surface input = encoder.createInputSurface();
                          encoder.start();
                          try {
                              Bundle b = new Bundle();
                              b.putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0);
                              encoder.setParameters(b);
                          } catch (Throwable ignored) { }
                          display = projection.createVirtualDisplay(
                              "dtsg-arb", w, h, dm.densityDpi == 0 ? 160 : dm.densityDpi,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, input, null, null);
                          if (display == null) { stop("no-display"); return; }
                          link = new RtmpLink(url, path);
                          if (!link.connect()) { stop("rtmp-connect"); return; }
                          running = true;
                          firstPts = -1;
                          push("state", "live", null);
                          encThread = new Thread(new Runnable() {
                              @Override public void run() { pump(); }
                          }, "arb-enc");
                          encThread.start();
                      } catch (Throwable t) {
                          push("state", "failed", "init");
                          stop("init-failed");
                      }
                  }
          
                  /* ضخّ مخارج المرمّز إلى RTMP حتى الإيقاف أو العطل */
                  void pump() {
                      android.media.MediaCodec.BufferInfo info = new android.media.MediaCodec.BufferInfo();
                      while (running) {
                          try {
                              int oi = encoder.dequeueOutputBuffer(info, 10000);
                              if (oi < 0) continue;
                              java.nio.ByteBuffer buf = encoder.getOutputBuffer(oi);
                              if (buf == null) { encoder.releaseOutputBuffer(oi, false); continue; }
                              int len = info.size;
                              if (len <= 0) { encoder.releaseOutputBuffer(oi, false); continue; }
                              byte[] data = new byte[len];
                              buf.position(info.offset);
                              buf.get(data);
                              encoder.releaseOutputBuffer(oi, false);
                              boolean cfg = (info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0;
                              if (cfg) { link.sendConfig(data); continue; }
                              if (firstPts < 0) firstPts = info.presentationTimeUs;
                              long ts = (info.presentationTimeUs - firstPts) / 1000;
                              if (ts < 0) ts = 0;
                              link.sendFrame(data, ts);
                          } catch (Throwable t) {
                              if (running) {
                                  push("state", "failed", "encode");
                                  stop("encode");
                              }
                              return;
                          }
                      }
                  }
          
                  /* الإيقاف النظيف من أي مسار */
                  void stop(String why) {
                      boolean was = running;
                      running = false;
                      try { if (encThread != null) encThread.interrupt(); } catch (Throwable ignored) { }
                      encThread = null;
                      try { if (encoder != null) { encoder.stop(); encoder.release(); } } catch (Throwable ignored) { }
                      encoder = null;
                      try { if (display != null) display.release(); } catch (Throwable ignored) { }
                      display = null;
                      try { if (projection != null) projection.stop(); } catch (Throwable ignored) { }
                      projection = null;
                      try { if (link != null) link.close(); } catch (Throwable ignored) { }
                      link = null;
                      firstPts = -1;
                      try {
                          stopService(new android.content.Intent(MainActivity.this, ArbShareService.class));
                      } catch (Throwable ignored) { }
                      if (was) push("state", "stopped", null);
                  }
          
                  /* دفع حدث للصفحة — JSONObject داخل try/catch (درس بناء #24) */
                  void push(String t, String state, String err) {
                      try {
                          final Bridge b = getBridge();
                          if (b == null || b.getWebView() == null) return;
                          JSONObject o = new JSONObject();
                          o.put("t", t);
                          o.put("state", state);
                          if (err != null) o.put("err", err);
                          final String js = "try{if(window.__dtsgArbEvt)window.__dtsgArbEvt(" + o.toString() + ");}catch(e){}";
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  try { b.getWebView().evaluateJavascript(js, null); } catch (Throwable ignored) { }
                              }
                          });
                      } catch (Throwable ignored) { }
