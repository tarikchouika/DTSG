          #    (خدمة الأمامية من نوع mediaProjection إلزامية للنشر من API 29+).
          #    [درس بناء #25] المرساة = إذن الكاميرا (خطوة 8.4 السابقة) لا إذن
          #    بلوتوث LocalNet — ذاك تُحقنه خطوة 8.6 اللاحقة فالرسو عليه هنا أسقط
          #    البناء (السير خطوات متسلسلة: 8.5 يعمل قبل 8.6).
          p4 = "android/app/src/main/AndroidManifest.xml"
          m = io.open(p4, encoding="utf-8").read()
          if "FOREGROUND_SERVICE_MEDIA_PROJECTION" not in m:
              anchor2 = '<uses-permission android:name="android.permission.CAMERA" /> <!-- [v2.83] LocalMP QR -->'
              if anchor2 not in m:
                  sys.exit("X قالب AndroidManifest تغيّر: لم أجد مرساة CAMERA — راجع خطوة الحقن (8.5-4)")
              m = m.replace(anchor2, anchor2 + "\n" +
                  "    <!-- [v2.88] بث التحكيم: إسقاط الشاشة عبر خدمة أمامية -->\n" +
                  "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n" +
                  "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION\" />\n" +
                  "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />", 1)
          if "ArbShareService" not in m:
              app_close = "</application>"
              if app_close not in m:
                  sys.exit("X قالب AndroidManifest تغيّر: لم أجد </application> — راجع خطوة الحقن (8.5-4)")
              m = m.replace(app_close,
                  "    <service android:name=\".ArbShareService\" android:exported=\"false\" android:foregroundServiceType=\"mediaProjection\" /> <!-- [v2.88] بث التحكيم -->\n" +
                  app_close, 1)
          io.open(p4, "w", encoding="utf-8").write(m)
          print("OK AndroidManifest: أذونات الإسقاط + خدمة mediaProjection")
          PY3

      # 8.6) [v2.87·LocalNet] أذونات الشبكة المحلية للّعب المباشر: اكتشاف
      #      NSD/mDNS يحتاج البث المتعدد على الواي فاي، والبلوتوث (إعلان BLE
      #      + مسح + قنوات RFCOMM غير الآمنة بين الهواتف) يحتاج الأذونات
      #      الثلاث على Android 12+ والقديمتين قبلها — كلها عادية بلا موقع.
      #      python3 بمرساة إذن الكاميرا المحقون في 8.4 وفشل صريح إن تغيّر
      #      القالب (نمط 8.4/8.5).
      - name: Inject local-network permissions (NSD multicast + Bluetooth)
        run: |
          python3 - <<'PY25'
          import io, sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = io.open(p, encoding="utf-8").read()
          if "android.permission.BLUETOOTH_CONNECT" in s:
              print("OK أذونات الشبكة المحلية موجودة مسبقاً"); sys.exit(0)
          anchor = '<uses-permission android:name="android.permission.CAMERA" /> <!-- [v2.83] LocalMP QR -->'
          if anchor not in s:
              sys.exit("X قالب AndroidManifest تغيّر: لم أجد مرساة CAMERA — راجع خطوة الحقن (8.6)")
          add = (
              "\n    <!-- [v2.87·LocalNet] الغرفة المحلية: اكتشاف NSD على الواي فاي + بلوتوث مباشر -->\n"
              "    <uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH\" android:maxSdkVersion=\"30\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" android:maxSdkVersion=\"30\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" android:usesPermissionFlags=\"neverForLocation\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_ADVERTISE\" />\n"
              "    <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" /> <!-- [v2.87] LocalNet -->"
          )
          s = s.replace(anchor, anchor + add, 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("OK أذونات LocalNet (بث متعدد + بلوتوث) — الغرف المحلية المباشرة")
          PY25

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 8.1) [v2.82] فحص أسرار التوقيع **قبل أي عمل ثقيل** — فشل فوري برسالة
      #      واضحة بدل انهيار Gradle غامض بعد دقائق. الأسرار الأربعة تُضبط
      #      مرة واحدة في Settings ⇒ Secrets and variables ⇒ Actions
      #      (القيم والتعليمات مع المالك — لا تُكتب في المستودع أبداً، قاعدة 5).
      - name: Verify signing secrets are configured (fail fast)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "✗ السر $v غير مضبوط (Settings ⇒ Secrets and variables ⇒ Actions)"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "إعداد لمرة واحدة: أضِف الأسرار الأربعة أعلاه (شهادة توقيع"
            echo "الإنتاج بـBase64 + كلمة السر + الاسم المستعار) ثم أعد"
            echo "تشغيل الـWorkflow (Re-run). تفاصيل: docs/APK_BUILD.md §6"
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✓ أسرار التوقيع الأربعة موجودة"

      # 8.2) [v2.82] فك ترميز شهادة الإنتاج (Base64 ⇒ ملف) والتحقق منها بمفتاح
      #      Java **قبل البناء**: كلمة السر صحيحة + الاسم المستعار موجود، ويُطبع
      #      صاحب الشهادة وتاريخ انتهائها (30 سنة) في السجل. الملف يُكتب في
      #      $RUNNER_TEMP خارج المستودع ولا يُرفع ولا يُطبع محتواه أبداً.
      - name: Decode production keystore + verify with keytool
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/dtsg-production.keystore"
          KEYTOOL_INFO="$(keytool -list -v -keystore "$RUNNER_TEMP/dtsg-production.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")" || {
            echo "✗ الشهادة لا تُفتح بالسرّ/الاسم المستعار المُمرَّر — راجع قيم الأسرار الثلاثة"; exit 1; }
          echo "$KEYTOOL_INFO" | grep -E 'Owner:|Valid from' || true
          echo "✓ شهادة الإنتاج جاهزة: alias=$ANDROID_KEY_ALIAS (30 سنة) — $RUNNER_TEMP/dtsg-production.keystore"

      # 8.3) [v2.82] حقن توقيع الإنتاج في build.gradle المولَّد حديثاً: قالب
      #      Capacitor 6 **لا يعرّف signingConfig للإصدار أصلاً** (فحص قالب
      #      6.2.2) — فتُخرج assembleRelease ملفاً غير موقَّع. الحقن: كتلة
      #      signingConfigs.dtsgRelease تقرأ الشهادة من متغيرات البيئة + سطر
      #      signingConfig داخل buildTypes.release. ويُستثمار نفس الخطوة لكتابة
      #      إصدار الحزمة وversionCode (رقم التشغيل — يزداد رتيباً) داخل الـAPK
      #      بدل 1.0/1 القالبية. python3 بدل sed: مطابقة نصية دقيقة وفشل صريح
      #      إن تغيّر القالب مستقبلاً.
      - name: Inject production signingConfig + app version into generated build.gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_VERSION="$PKG_VERSION" VERSION_CODE="$VERSION_CODE" python3 - <<'PY'
          import io, os, sys
          p = "android/app/build.gradle"
          s = io.open(p, encoding="utf-8").read()
          sig_cfg = (
              "    signingConfigs {\n"
              "        dtsgRelease {\n"
              "            storeFile file(System.getenv(\"ANDROID_KEYSTORE_FILE\"))\n"
              "            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n"
          )
          old = "    buildTypes {\n        release {\n"
          if old not in s:
              sys.exit("✗ قالب build.gradle تغيّر: لم أجد مرساة buildTypes — راجع خطوة الحقن (8.3)")
          s = s.replace(old, sig_cfg + old, 1)
          s = s.replace("        release {\n",
                        "        release {\n            signingConfig signingConfigs.dtsgRelease // [v2.82] توقيع إنتاجي بشهادة المالك (CI)\n", 1)
          if 'versionCode 1\n' not in s or 'versionName "1.0"' not in s:
              sys.exit("✗ قالب build.gradle تغيّر: لم أجد versionCode/versionName القالبية")
          s = s.replace("versionCode 1\n", "versionCode " + os.environ["VERSION_CODE"] + "\n", 1)
          s = s.replace('versionName "1.0"', 'versionName "' + os.environ["PKG_VERSION"] + '"', 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("✓ signingConfig dtsgRelease + version " + os.environ["PKG_VERSION"]
                + " (" + os.environ["VERSION_CODE"] + ") حُقنت — الإصدار يُوقَّع بشهادة المالك")
          PY

      # 8) بناء APK إصدار موقَّع [v2.82] — كان assembleDebug بشهادة debug
      #    الافتراضية: صلاحية تنفيذ للـ wrapper ثم assembleRelease بلا دايمون
      #    (بيئة CI نظيفة بلا عمليات عالقة)، والشهادة تُمرَّر بالبيئة حصراً.
      - name: Gradle assembleRelease (signed with production keystore)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dtsg-production.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      # 9) [v2.82] تحقق مستقل من التوقيع بعد البناء: apksigner يفحص الـAPK
      #    ويجب أن يكون الموقِّع شهادة الإنتاج (CN=DTSG…) — لا debug ولا غير
      #    موقَّع. فشل هنا = البناء كله يفشل قبل أي نشر.
      - name: Verify APK signature is the production cert (apksigner)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "✗ $APK غير موجود — راجع سجل Gradle"; exit 1; }
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          echo "$CERTS" | grep -q 'CN=DTSG' || { echo "✗ الموقِّع ليس شهادة الإنتاج (CN=DTSG…) — يُمنع النشر"; exit 1; }
          echo "✓ الـAPK موقَّع بشهادة الإنتاج (DTSG) — التوقيع صحيح"

      # 9.5) [v2.82] تجهيز ملف التحميل النهائي باسمه الثابت + بصمة SHA-256
      #      (البصمة تُنشر مع الإصدار ليتحقق المالك من سلامة التنزيل)
      - name: Stage APK with stable name + SHA-256 checksum
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/${APK_NAME}.apk"
          sha256sum "$RUNNER_TEMP/${APK_NAME}.apk" > "$RUNNER_TEMP/${APK_NAME}.apk.sha256"
          echo "-- SHA-256 --"; cat "$RUNNER_TEMP/${APK_NAME}.apk.sha256"

      # 9.7) Artifact احتياطي (7 أيام) — طريقة الوصول الأولى هي الـRelease
      #      أدناه (تحميل مباشر بلا ZIP). الـArtifact للطوارئ/التشخيص فقط.
      - name: Upload APK artifact (backup — official download is the Release)
        uses: actions/upload-artifact@v4
        with:
          name: DSTG-Gaming-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # 10) [v2.82] نشر GitHub Release: الوسم apk-v<الإصدار>-build<رقم التشغيل>
      #     فريد لكل تشغيل، والعلم --latest يجعله «أحدث إصدار» ⇒ رابط
      #     /releases/latest/download/ يخدم آخر APK دائماً. الملفان يُرفعان
      #     **كأصلين مباشرين** (apk + sha256) — بلا ضغط ZIP. وإعادة تشغيل
      #     نفس التشغيل تُنظف وسم/إصدار سابقاً نصف مكتمل ثم تعيد الإنشاء.
      - name: Publish GitHub Release (direct APK download)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="apk-v${VERSION}-build${RUN_NUMBER}"
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          ## DTSG Android App v${VERSION} (بناء #${RUN_NUMBER})

          - **الملف:** ${APK_NAME}.apk — توقيع إنتاجي بشهادة المالك (صلاحية 30 سنة)
          - **الكود:** ${SHORT_SHA} (${COMMIT_SHA}) — ${STAMP}
          - **الإصدار داخل التطبيق:** ${VERSION} · versionCode ${RUN_NUMBER}
          - **التحقق من السلامة:** بصمة SHA-256 مرفقة (${APK_NAME}.apk.sha256)

          ### رابط التحميل المباشر الدائم (أحدث إصدار دائماً)
          https://github.com/tarikchouika/DTSG/releases/latest/download/${APK_NAME}.apk

          ### التثبيت
          1. نزّل الملف إلى هاتف الأندرويد.
          2. انقره ⇒ اسمح بالتثبيت «من مصادر غير معروفة» لهذا المدير إن طُلب ⇒ تثبيت.
          3. **من نسخة Debug القديمة:** احذف التطبيق القديم أولاً — التوقيعان مختلفان
             والأندرويد يمنع التحديث فوق توقيع مغاير. من إصدار إنتاج سابق يتحدث مباشرة.
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            "$RUNNER_TEMP/${APK_NAME}.apk" \
            "$RUNNER_TEMP/${APK_NAME}.apk.sha256" \
            --title "DTSG Android App v${VERSION} (build ${RUN_NUMBER})" \
            --notes-file "$NOTES" \
            --latest
          echo "✓ نُشر Release ${TAG} — التحميل المباشر: https://github.com/tarikchouika/DTSG/releases/latest/download/${APK_NAME}.apk"
