# ═══════════════════════════════════════════════════════════════════
# [v2.75] MediaMTX — إعداد خادم الوسائط البديل لنظام التحكيم (DTSG)
# ───────────────────────────────────────────────────────────────────────
# الهدف: ترحيل بث شاشات اللاعبين عند تعذر WebRTC P2P — بلا ترميز
#        (صفر استهلاك معالج إضافي على الهاتف: الترحيل فقط).
# العنوان: http://127.0.0.1:8889  (WHIP للنشر + WHEP للمشاهدة)
# المسارات: dtsg/<roomId>/<playerId> أو dtsg-<roomId>-<playerId>  (انظر كتلة paths)
#
# التشغيل: ضع هذا الملف بجوار ثنائي mediamtx ثم  ./mediamtx
# التفعيل في المنصة: MEDIAMTX_WHIP_URL=http://127.0.0.1:8889
#   (في .env.local ثم bash scripts/phone-env-restart.sh)
# التفصيل الكامل: docs/ARBITRATION_SETUP.md §5
# ═══════════════════════════════════════════════════════════════════

# منفذ HTTP للإدارة/WHIP/WHEP — محلي حصراً (المسار الخارجي عبر نفق إضافي عند الحاجة)
api: yes
# [v2.81] واجهة الاستعلام الداخلية (المستند: ربط MediaMTX API بالباكأند):
# محشورة داخل السيرفر المحلي فقط ولا تُكشف للخارج — الباكأند يستعلمها عبر
# Loopback حصراً (صفر باندويث عبر النفق) عند الطلب حصراً (لا حلقات خلفية):
#   GET http://127.0.0.1:9997/v3/paths/get/{path}
# البيئة المكملة في .env.local (ثم bash scripts/phone-env-restart.sh):
#   MEDIAMTX_API_URL=http://127.0.0.1:9997   (افتراضي — لا يلزم كتابتها إن لم تُغيَّر)
#   MEDIAMTX_RTMP_URL=rtmp://<عنوان-النفق-العام>:1935   (لمشاركة شاشة الهاتف)
# التحقق بعد إعادة تشغيل MediaMTX:
#   curl -s http://127.0.0.1:9997/v3/paths/list
apiAddress: 127.0.0.1:9997
hlsVariant: lowLatency

# ═══════════ [v2.81.1] حصر كل المستمعين على Loopback ═══════════
# الافتراضي في MediaMTX هو الربط على كل الواجهات (":المنفذ") ⇒ أي جهاز على
# شبكة الهاتف Wi-Fi يصل إلى 1935/8554/8888/8889 مباشرة. حصرناها كلها على
# 127.0.0.1: لا شيء يخرج عن الجهاز إلا عبر نفق يختاره المالك صراحةً.
#   · rtmpAddress   127.0.0.1:1935 — يُنفَّذ عبر نفق bore.pub المعتمد
#     [v2.81.2] والمُتحقَّق منه؛ [v2.81.3] أُزيل بديل Cloudflare WARP بقرار
#     المالك (تفعيل Zero Trust يتطلّب بطاقة بنكية غير متاحة) فلا خيار نقل ثانٍ.
#     وإن اختار المالك «port-forward» من الراوتر (وهو الخيار الأضعف أمنياً)
#     فعليه سطر واحد هنا: غيّرها إلى :1935 (بلا 127.0.0.1) — وستبقى
#     مصادقة المسار (الرمز) هي الحماية الوحيدة لا سواها.
#   · webrtcAddress 127.0.0.1:8889 — WHIP/WHEP محليّان فقط.
rtmpAddress: 127.0.0.1:1935
rtspAddress: 127.0.0.1:8554
hlsAddress: 127.0.0.1:8888
webrtcAddress: 127.0.0.1:8889

paths:
  # [v2.81] إصلاح إعداد كان غير قابل للإقلاع على أي إصدار v1.x من MediaMTX
  #   (منذ v2.75) — ولم يُكتشف لأن ثنائي MediaMTX لم يكن مثبتاً على الهاتف قط:
  #   (1) كان اسم المسار `dtsg/` — وIsValidPathName في internal/conf/path.go
  #       ترفض أي اسم ينتهي بشرطة مائلة ("can't end with a slash") فيمتنع
  #       الخادم عن الإقلاع أصلاً.
  #   (2) كان `fallback: present` — وحقل fallback في v1.x حقل إعادة توجيه
  #       (redirect) لا يقبل إلا مساراً أو عنوان RTSP صالحاً (checkRedirect)،
  #       فالسلسلة الحرفية `present` تُفشل التحقق، والحقل مهجور مع تحذير في
  #       النسخة الحالية. والمقصود «يقبل هذا المسار من ينشر إليه» هو
  #       `source: publisher` وحدها ⇒ حُذف السطر بالكامل.
  # [v2.81] والاسم الآن تعبير نمطي `~^dtsg` — الصيغة المعتمدة في MediaMTX لـ
  #   «كل المسارات المطابقة» — فيغطي صيغتي النشر معاً:
  #     · RTMP (مشاركة شاشة الهاتف من الخارج): dtsg/<roomId>/<userId>_<token>
  #     · WHIP  (ما ينشره arb-client.js فعلياً): dtsg-<roomId>-<userId>_<token>
  #   (الأخيرة أصلاً خارج `dtsg/` فلا يغطيها اسم حرفي.)
  #   ⚠ ولا يُنهَ المفتاح بشرطة مائلة أبداً (`~^dtsg/`): الشرطة الذيلة تُخرج
  #     الاسم من دائرة التعابيرية فيعود رفض IsValidPathName ولا يُقلع الخادم.
  # ✅ [v2.81.1] بند المصادقة — مُغلق. كان بنداً مفتوحاً: كل من يصل إلى RTMP
  #   ينشر في مسار أي غرفة، والباكأند يستنتج «هذا اللاعب بعينه يبث» من مجرّد
  #   جاهزية المسار dtsg/<roomId>/<userId> ⇒ انتحال بثّ الخصم أمام الأدمن.
  #   الحل: **الرمز داخل المسار** —
  #     token = أول 16 خانة من HMAC-SHA256(ARB_STREAM_SECRET, "<roomId>:<userId>")
  #   مشتقٌّ في الخادم، يُسلَّم للاعب الجالس في غرفته حصراً، ويعيد المراقب
  #   اشتقاقه للتحقق. فمعرّفا الغرفة واللاعب قابلان للتخمين، والرمز لا؛
  #   والمسار المجرّد بلا رمز لم يعد يُستعلَم عنه ولا يُصدَّق.
  #   وMediaMTX نفسه يبقى بلا مصادقة (لا publishUser ولا authInternal) فحماية
  #   المسار هي الطبقة الوحيدة — وهي كافية لأن «الجاهز» لم يعد دليلاً إلا
  #   برمز صحيح. وضِمناً: كل المستمعين مربوطين على Loopback (أعلى).
  ~^dtsg:
    source: publisher
    # بلا ترميز — ترحيل فقط (الأخف للهاتف). إن لزمت درجة أقل أضف:
    # ffmpeg: ffmpeg -i rtsp://localhost:8554/$GID -vf scale=854:480 -c:v libx264 -preset veryfast -b:v 700k -c:a copy -f rtsp rtsp://localhost:8554/low_$GID
